  const scopeLeaves = cur ? leavesOfInit(cur.id) : allLeaves();
  const st = stats(scopeLeaves);
  const sel = sideEntries.find(e => e.id === ui.track);

  return `<div class="work">
    <aside class="card side">
      <h4>${cur ? 'TRACKS' : 'INITIATIVES'}</h4>
      <button class="side-item ${ui.track === 'all' ? 'active' : ''}" data-act="track" data-id="all"><span class="lbl">All ${cur ? 'tracks' : 'initiatives'}</span><span class="n">${scopeLeaves.length}</span></button>
      ${sideEntries.map(e => `<button class="side-item ${ui.track === e.id ? 'active' : ''}" data-act="track" data-id="${e.id}" title="${esc(e.label)} — ${esc(e.status || '')}">
        <span class="dot" style="background:${e.status ? STATUS_META[e.status].color : 'var(--border-strong)'}"></span><span class="lbl">${esc(e.label)}</span><span class="n">${e.count}</span></button>`).join('')}
      ${cur && canEdit() ? `<button class="side-item" style="color:var(--primary)" data-act="add-item" data-init="${cur.id}">+ Add track</button>` : ''}
      <div class="foot">
        <div style="font-weight:700;letter-spacing:.1em;font-size:11px">COMPLETION</div>
        <div class="big">${st.pct}%</div>
        <div class="bar"><div style="width:${st.pct}%"></div></div>
        <p style="margin:10px 0 0">A track or parent item shows the <b>lowest</b> status of its sub-items. Void items are excluded. Ticking a box marks the item Completed.</p>
      </div>
    </aside>
    <section>
      <div class="toolbar">
        <input type="search" placeholder="Search items, notes or owners…" value="${esc(ui.search)}" data-act="search">
        <select data-act="filter-status"><option value="all">All statuses</option>${STATUSES.map(s => `<option ${ui.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
        <label class="chk"><input type="checkbox" data-act="hide-done" ${ui.hideDone ? 'checked' : ''}> Hide completed / void</label>
        <label class="chk"><input type="checkbox" data-act="overdue-only" ${ui.overdueOnly ? 'checked' : ''}> Overdue only</label>
        <div class="seg" role="tablist" aria-label="Board view"><button class="${ui.mode === 'tracks' ? 'on' : ''}" data-act="mode" data-mode="tracks" title="${cur ? 'One column per track' : 'One column per initiative'}">${cur ? 'By track' : 'By initiative'}</button><button class="${ui.mode === 'status' ? 'on' : ''}" data-act="mode" data-mode="status" title="One column per status">By status</button><button class="${ui.mode === 'roadmap' ? 'on' : ''}" data-act="mode" data-mode="roadmap" title="Timeline of start dates and deadlines">Roadmap</button></div>
      </div>
      <div class="work-head"><h3>${sel ? esc(sel.label) : (cur ? 'All tracks' : 'All initiatives')}</h3><span class="meta" id="countMeta"></span></div>
      ${ui.mode === 'status' ? renderBoard(cur) : ui.mode === 'roadmap' ? renderRoadmap(cur) : renderTrackBoard(cur)}
    </section>
  </div>`;
}

function matches(item) {
  const s = effStatus(item);
  if (ui.status !== 'all' && s !== ui.status) return false;
  if (ui.hideDone && isClosed(s)) return false;
  if (ui.overdueOnly) { const d = dueInfo(item); if (!d || d.cls !== 'over') return false; }
  if (ui.search) {
    const q = ui.search.toLowerCase();
    const hay = [item.name, item.notes, item.owner, codeOf(item), ...ancestors(item).map(a => a.name)].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
// A node shows if it matches or any descendant matches.
function visible(item, memo) {
  if (memo.has(item.id)) return memo.get(item.id);
  const v = matches(item) || childrenOf(item.id).some(c => visible(c, memo));
  memo.set(item.id, v); return v;
}
const filtersActive = () => ui.search || ui.status !== 'all' || ui.hideDone || ui.overdueOnly;

function rootsInScope(cur) {
  if (cur) return tracksOf(cur.id).filter(t => ui.track === 'all' || t.id === ui.track);
  return initiatives().filter(i => ui.track === 'all' || i.id === ui.track).flatMap(i => tracksOf(i.id));
}

// Items from other initiatives linked into `cur`. If an item and one of its
// ancestors are both linked, only the ancestor is listed (its subtree covers it).
function linkedRoots(cur) {
  const linkedHere = i => (i.links || []).includes(cur.id) && i.initiativeId !== cur.id;
  return db.items.filter(i => linkedHere(i) && !ancestors(i).some(linkedHere))
    .sort((a, b) => (a.initiativeId + codeOf(a)).localeCompare(b.initiativeId + codeOf(b), undefined, { numeric: true }));
}
// The linked item (itself or an ancestor) that brings `item` into initiative `initId`, if any.
function linkSource(item, initId) {
  if (item.initiativeId === initId) return null;
  return [item, ...ancestors(item).reverse()].find(x => (x.links || []).includes(initId)) || null;
}

/* Track board ("By track" / "By initiative"): columns are tracks (or initiatives on
   the overview); each card is one item with its own sub-items listed inside it, so a
   long list becomes several short columns instead of one long page. */
function renderTrackBoard(cur) {
  const memo = new Map();
  let cardCount = 0;
  const show = i => visible(i, memo);
  const cardsFor = (list, opts) => list.filter(show).map(i => { cardCount++; return itemCard(i, opts, show); }).join('');
  let cols = '';
  if (cur) {
    cols = rootsInScope(cur).filter(show).map(t => trackColumn(t, cardsFor(childrenOf(t.id), {}))).join('');
    if (ui.track === 'all' && canEdit()) cols += `<section class="tcol tcol-add" aria-label="Add a track">${quickAddHTML(cur.id, null)}</section>`;
    if (ui.track === 'all') {
      const linked = linkedRoots(cur).filter(show);
      if (linked.length) cols += `<section class="tcol" aria-label="Linked from other initiatives">
        <div class="tcol-head linkcol"><div class="group-label">Linked from other initiatives</div>
          <div class="meta-line">Shown here, counted in their own initiative.</div></div>
        <div class="tcol-body" data-scroll-key="col-linked">${cardsFor(linked, { linkedInto: cur })}</div></section>`;
    }
  } else {
    cols = initiatives().filter(i => ui.track === 'all' || i.id === ui.track)
      .map(i => initiativeColumn(i, cardsFor(tracksOf(i.id), { trackCard: true }))).join('');
  }
  queueMicrotask(() => { const m = document.getElementById('countMeta'); if (m) m.textContent = `${cardCount} card${cardCount === 1 ? '' : 's'} · scroll sideways for more columns`; });
  if (!cols) return `<div class="card empty">${filtersActive() ? 'No items match the filters.' : cur ? 'No tracks yet.' : 'No initiatives yet.'}</div>`;
  return `<div class="tboard" data-scroll-key="track-board:${ui.view}:${ui.track}">${cols}</div>`;
}

/* Quick add: a "+ Add 1d" / "+ Add Track 7" button at the foot of a column that
   opens a one-line name box. Enter creates the item with the next code and keeps
   the box open for the next one; Esc or Cancel closes it. */
const quickAdd = { key: null, value: '', busy: false };
const qaKey = (initId, parentId) => parentId || 'tracks:' + initId;
function nextCodeLabel(initId, parentId) {
  if (!parentId) return 'Track ' + (tracksOf(initId).length + 1);
  const parent = IDX.byId.get(parentId), n = childrenOf(parentId).length;
  return parent.parentId ? `${codeOf(parent)}.${n + 1}` : codeOf(parent) + letters(n);
}
function quickAddHTML(initId, parentId) {
  const key = qaKey(initId, parentId), next = nextCodeLabel(initId, parentId);
  const where = parentId ? `under ${codeOf(IDX.byId.get(parentId))}` : `to ${IDX.initById.get(initId)?.name || ''}`;
  if (quickAdd.key !== key) return `<div class="qa"><button class="qa-btn" data-act="qa-open" data-key="${key}" title="Add ${esc(next)} ${esc(where)}">+ Add ${esc(next)}</button></div>`;
  return `<form class="qa qa-form" data-qa-form data-init="${initId}" data-parent="${parentId || ''}" autocomplete="off">
    <label for="qa-input">New ${parentId ? 'item' : 'track'} <span class="code">${esc(next)}</span></label>
    <input id="qa-input" data-qa-input type="text" placeholder="${parentId ? 'Item name' : 'Track name'}" value="${esc(quickAdd.value)}" ${quickAdd.busy ? 'disabled' : ''}>
    <div class="ctrls"><button class="btn sm primary" type="submit">Add ${esc(next)}</button><button class="btn sm" type="button" data-act="qa-close">Cancel</button>
      <span class="help">Starts as Thoughts · Enter adds, Esc closes</span></div>
  </form>`;
}
function openQuickAdd(key) { quickAdd.key = key; quickAdd.value = ''; render(); focusQuickAdd(true); }
function closeQuickAdd() { if (!quickAdd.key) return; quickAdd.key = null; quickAdd.value = ''; render(); }
function focusQuickAdd(reveal) {
  const input = document.getElementById('qa-input'); if (!input) return;
  input.focus({ preventScroll: !reveal });
  input.setSelectionRange(input.value.length, input.value.length);
  if (reveal) input.closest('.qa-form').scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
async function submitQuickAdd(form) {
  const name = quickAdd.value.trim();
  if (!name) { closeQuickAdd(); return; }
  const initId = form.dataset.init, parentId = form.dataset.parent || null;
  const code = nextCodeLabel(initId, parentId);
  const now = new Date().toISOString();
  const created = { id: uid(), initiativeId: initId, parentId, name, status: 'Thoughts', deadline: '', owner: '', notes: '', links: [], order: nextOrder(initId, parentId), createdAt: now, updatedAt: now };
  db.items.push(created);
  if (parentId) ui.collapsed = ui.collapsed.filter(c => c !== parentId);
  quickAdd.value = '';
  commit({ items: [created] });
  render();
  focusQuickAdd(true); // ready for the next one
  toast(`Added ${code} ${name}${filtersActive() && !matches(IDX.byId.get(created.id) || created) ? ' (hidden by the current filters)' : ''}.`);
}

/* Roadmap. Each item is drawn from its start date to its deadline. A parent spans
   the earliest start to the latest deadline among itself and its sub-items. With a
   deadline only it is a milestone (diamond); with no dates it is listed as not
   scheduled, so nothing disappears from view. */
const DAY = 86400000;
const isoDays = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY; };
const daysIso = n => new Date(n * DAY).toISOString().slice(0, 10);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtShort = iso => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${MONTHS[m - 1]}`; };

function spanOf(item) { return spanOfAll([item, ...descendants(item)]); }
function spanOfAll(all) {
  const starts = all.map(x => x.startDate).filter(Boolean).sort();
  const ends = all.map(x => x.deadline).filter(Boolean).sort();
  const start = starts[0] || '', end = ends[ends.length - 1] || '';
  if (start && end) return start <= end ? { kind: 'bar', start, end } : { kind: 'bar', start: end, end: start };
  if (end) return { kind: 'milestone', end };
  if (start) return { kind: 'start', start };
  return { kind: 'none' };
}

function renderRoadmap(cur) {
  const memo = new Map();
  const show = i => visible(i, memo);
  const lanes = [];
  if (cur) {
    rootsInScope(cur).filter(show).forEach(t => lanes.push({ key: t.id, item: t, title: `Track ${codeOf(t)} ${t.name}`, rows: childrenOf(t.id).filter(show) }));
    if (ui.track === 'all') {
      const linked = linkedRoots(cur).filter(show);
      if (linked.length) lanes.push({ key: 'linked:' + cur.id, title: 'Linked from other initiatives', rows: linked, linked: true });
    }
  } else {
    initiatives().filter(i => ui.track === 'all' || i.id === ui.track).forEach(i => {
      const rows = tracksOf(i.id).filter(show);
      if (rows.length || !filtersActive()) lanes.push({ key: i.id, init: i, title: i.name, rows });
    });
  }
  if (!lanes.length) return `<div class="card empty">${filtersActive() ? 'No items match the filters.' : 'No tracks yet.'}</div>`;
  if (ui.rmZoom === 'quarters') return renderQuarterBoard(cur, lanes);
  // Time range: every date in view plus today, padded to whole months, at least 6 months.
  const today = isoDays(stamp());
  const dates = [today];
  lanes.forEach(l => [l.item, ...l.rows].filter(Boolean).forEach(r => { const sp = spanOf(r); if (sp.start) dates.push(isoDays(sp.start)); if (sp.end) dates.push(isoDays(sp.end)); }));
  const first = new Date(Math.min(...dates) * DAY), last = new Date(Math.max(...dates) * DAY);
  let y0 = first.getUTCFullYear(), m0 = first.getUTCMonth() - 1; if (m0 < 0) { m0 += 12; y0--; }
  let y1 = last.getUTCFullYear(), m1 = last.getUTCMonth() + 2;
  while ((y1 - y0) * 12 + (m1 - m0) < 6) m1++;
  const from = Date.UTC(y0, m0, 1) / DAY, to = Date.UTC(y1, m1, 1) / DAY;
  const pxDay = ui.rmZoom === 'quarters' ? 1.4 : 3.6;
  const W = Math.round((to - from) * pxDay), LABEL = 280;
  const x = d => Math.round((d - from) * pxDay);
  // Header and grid lines
  let head = '', lines = '';
  for (let y = y0, m = m0; Date.UTC(y, m, 1) / DAY < to; m++) {
    if (m > 11) { m = 0; y++; }
    const d = Date.UTC(y, m, 1) / DAY, nx = Date.UTC(y, m + 1, 1) / DAY;
    const q = m % 3 === 0;
    if (q || d === from) head += `<div class="rm-q" style="left:${x(d)}px">Q${Math.floor(m / 3) + 1} ${y}</div>`;
    head += `<div class="rm-m" style="left:${x(d)}px;width:${x(nx) - x(d)}px">${ui.rmZoom === 'quarters' ? MONTHS[m].slice(0, 1) : MONTHS[m]}</div>`;
    lines += `<div class="rm-gl ${q ? 'q' : ''}" style="left:${x(d)}px"></div>`;
  }
  const todayX = x(today);
  lines += `<div class="rm-today" style="left:${todayX}px"><span>Today</span></div>`;

  let scheduled = 0, total = 0;
  const mark = (item, opts = {}) => {
    const s = effStatus(item), sp = spanOf(item), meta = STATUS_META[s];
    const late = !isClosed(s) && sp.end && isoDays(sp.end) < today;
    const tip = `${codeOf(item)} ${item.name}\n${s}${sp.start ? `\nStart ${fmtDate(sp.start)}` : ''}${sp.end ? `\nDeadline ${fmtDate(sp.end)}` : ''}${late ? `\nOverdue by ${today - isoDays(sp.end)} days` : ''}${hasKids(item) ? '\nSpan covers its sub-items' : ''}`;
    const tag = canEdit() ? 'button' : 'div';
    const act = canEdit() ? `data-act="edit-item" data-id="${item.id}" type="button"` : '';
    const vars = `--b-c:${meta.color};--b-bg:${meta.bg}`;
    if (sp.kind === 'none') {
      if (!ui.rmUnscheduled && !opts.summary) return '';
      return opts.summary ? '' : `<${tag} class="rm-none" ${act} style="left:${Math.max(4, todayX + 8)}px" title="${esc(tip)}">Not scheduled${canEdit() ? ' · add dates' : ''}</${tag}>`;
    }
    if (!opts.summary) scheduled++;
    if (sp.kind === 'bar') {
      const l = x(isoDays(sp.start)), w = Math.max(8, x(isoDays(sp.end) + 1) - l);
      if (opts.summary) return `<div class="rm-bar thin" style="${vars};left:${l}px;width:${w}px" title="${esc(tip)}"></div>`;
      const txt = w > 120 ? `${fmtShort(sp.start)} – ${fmtShort(sp.end)}` : '';
      return `<${tag} class="rm-bar ${late ? 'late' : ''} ${isClosed(s) ? 'closed' : ''}" ${act} style="${vars};left:${l}px;width:${w}px" title="${esc(tip)}" aria-label="${esc(tip.replace(/\n/g, ', '))}">${txt}</${tag}>`;
    }
    const at = sp.kind === 'milestone' ? sp.end : sp.start;
    const px = x(isoDays(at) + (sp.kind === 'milestone' ? 0.5 : 0));
    if (opts.summary) return `<div class="rm-ms" style="--b-c:${meta.color};left:${px}px;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;opacity:.6" title="${esc(tip)}"></div>`;
    return `<${tag} class="rm-ms ${late ? 'late' : ''}" ${act} style="--b-c:${meta.color};left:${px}px" title="${esc(tip)}" aria-label="${esc(tip.replace(/\n/g, ', '))}"></${tag}>
      <div class="rm-ms-label" style="left:${px}px">${sp.kind === 'milestone' ? 'Due' : 'Starts'} ${fmtShort(at)}${late ? ' · overdue' : ''}</div>`;
  };
  // Lane header: one thin bar for the whole track / initiative, coloured by its lowest status.
  const laneBar = (all, low) => {
    const sp = spanOfAll(all); if (sp.kind === 'none' || !low) return '';
    const c = STATUS_META[low].color, a = isoDays(sp.start || sp.end), b = isoDays(sp.end || sp.start);
    return `<div class="rm-bar thin" style="--b-c:${c};left:${x(a)}px;width:${Math.max(8, x(b + 1) - x(a))}px" title="${esc(`${sp.start ? fmtDate(sp.start) : ''}${sp.start && sp.end ? ' – ' : ''}${sp.end ? fmtDate(sp.end) : ''}`)}"></div>`;
  };
  // Where the timeline opens: today, or earlier when in-progress work started before it.
  let firstOpenStart = today;
  lanes.forEach(l => l.rows.forEach(r => { const sp = spanOf(r); if (sp.start && sp.end && isoDays(sp.end) >= today - 31) firstOpenStart = Math.min(firstOpenStart, isoDays(sp.start)); }));
  const openX = Math.max(0, Math.min(todayX - 60, x(Math.max(firstOpenStart, today - 120)) - 24));
  const rowHTML = (item, depthPad) => {
    total++;
    const s = effStatus(item);
    if (spanOf(item).kind === 'none' && !ui.rmUnscheduled) return '';
    return `<div class="rm-row">
      <div class="rm-label" style="padding-left:${10 + depthPad}px" title="${esc(codeOf(item) + ' ' + item.name)}">
        <span class="dot" style="background:${STATUS_META[s].color}" aria-hidden="true"></span>
        <span class="txt"><span class="code">${!cur && !item.parentId ? 'Track ' : ''}${codeOf(item)}</span>${esc(item.name)}</span>
      </div>
      <div class="rm-time" style="width:${W}px">${mark(item)}</div>
    </div>`;
  };
  let body = '';
  lanes.forEach(l => {
    const collapsed = ui.rmCollapsed.includes(l.key);
    const laneItems = l.item ? [l.item] : l.rows;
    const st = stats(laneItems.flatMap(leavesUnder));
    const low = l.item ? effStatus(l.item) : lowestStatus(l.rows);
    const titleHTML = l.init
      ? `<a href="#" data-act="view" data-view="${l.init.id}" style="color:inherit">${esc(l.title)}</a>`
      : esc(l.title);
    body += `<div class="rm-row rm-lane">
      <div class="rm-label">
        <button class="toggle" data-act="rm-lane" data-key="${l.key}" aria-expanded="${!collapsed}" aria-label="${collapsed ? 'Expand' : 'Collapse'} ${esc(l.title)}">${collapsed ? '▶' : '▼'}</button>
        ${low ? `<span class="dot" style="background:${STATUS_META[low].color}" title="${esc(low)}"></span>` : ''}
        <span class="txt" title="${esc(l.title)}">${titleHTML}</span>
        ${l.linked ? '' : `<span class="pct">${st.pct}%</span>`}
      </div>
      <div class="rm-time" style="width:${W}px">${laneBar(l.item ? [l.item, ...descendants(l.item)] : l.rows.flatMap(r => [r, ...descendants(r)]), low)}</div>
    </div>`;
    if (!collapsed) {
      if (l.item && !l.rows.length && spanOf(l.item).kind !== 'none') body += rowHTML(l.item, 18);
      body += l.rows.map(r => rowHTML(r, 18)).join('');
    }
  });
  const anyDates = scheduled > 0;
  queueMicrotask(() => { const m = document.getElementById('countMeta'); if (m) m.textContent = `${scheduled} of ${total} item${total === 1 ? '' : 's'} on the timeline`; });
  const setupNote = !store.hasStartDate
    ? `<div class="banner">Roadmap bars need a start date. Until it is added, items with a deadline show as milestones. To turn on start dates, run this once in the Supabase SQL Editor:
        <code style="display:block;margin-top:6px;white-space:pre-wrap;font-family:var(--mono);font-size:12px">alter table public.work_items add column if not exists start_date date;</code></div>` : '';
  const hint = !anyDates && lanes.length ? `<div class="banner info">Nothing has dates yet. ${canEdit() ? 'Click “Not scheduled · add dates” on any row (or Edit a card) and set a start date and deadline to place it on the roadmap.' : 'Editors can add start dates and deadlines to place items on the roadmap.'}</div>` : '';
  return `${setupNote}${hint}
    <div class="rm-tools">
      ${rmViewSeg()}
      <button class="btn sm" data-act="rm-today">Jump to today</button>
      <label class="chk" style="display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)"><input type="checkbox" data-act="rm-unscheduled" ${ui.rmUnscheduled ? 'checked' : ''}> Show items without dates</label>
      <div class="rm-legend" aria-label="Legend">
        <span><span class="rm-key-bar"></span>Start → deadline</span>
        <span><span class="rm-key-ms"></span>Deadline only</span>
        <span><span class="rm-key-today"></span>Today</span>
        <span><span class="rm-key-bar" style="box-shadow:0 0 0 2px var(--danger)"></span>Overdue</span>
        ${STATUSES.filter(st => st !== 'Void').map(st => `<span><span class="dot" style="background:${STATUS_META[st].color}"></span>${st}</span>`).join('')}
      </div>
    </div>
    <div class="rm" data-scroll-key="roadmap:${ui.view}:${ui.track}:${ui.rmZoom}" data-today-x="${todayX}" data-open-x="${openX}">
      <div class="rm-grid" style="--rm-label:${LABEL}px;width:calc(var(--rm-label) + ${W}px)">
        <div class="rm-row rm-head"><div class="rm-label">${cur ? 'Track / item' : 'Initiative / track'}</div><div class="rm-time" style="width:${W}px">${head}</div></div>
        <div style="position:relative">
          <div class="rm-overlay" style="left:var(--rm-label);width:${W}px">${lines}</div>
          ${body}
        </div>
      </div>
    </div>`;
}
const rmViewSeg = () => `<div class="seg" aria-label="Roadmap view"><button class="${ui.rmZoom !== 'quarters' ? 'on' : ''}" data-act="rm-zoom" data-zoom="months" title="Bars on a month-by-month timeline">Timeline</button><button class="${ui.rmZoom === 'quarters' ? 'on' : ''}" data-act="rm-zoom" data-zoom="quarters" title="What is due this quarter and next">Next 2 quarters</button></div>`;

/* "Next 2 quarters": a plain board of what is due this quarter and next, plus an
   Overdue column when anything is late. Each item goes in the quarter of its
   deadline (or of its start date if it has no deadline), grouped by track. */
function renderQuarterBoard(cur, lanes) {
  const t = new Date(), y = t.getFullYear(), q = Math.floor(t.getMonth() / 3);
  const qStart = (yy, qq) => { yy += Math.floor(qq / 4); qq = ((qq % 4) + 4) % 4; return { y: yy, q: qq, from: `${yy}-${String(qq * 3 + 1).padStart(2, '0')}-01` }; };
  const Q0 = qStart(y, q), Q1 = qStart(y, q + 1), Q2 = qStart(y, q + 2);
  const todayIso = stamp();
  const qLabel = Q => `Q${Q.q + 1} ${Q.y}`;
  const qRange = (Q, N) => { const [a, b] = [Q.from, N.from].map(v => v.split('-').map(Number)); const end = new Date(b[0], b[1] - 1, 0); return `${MONTHS[a[1] - 1]} – ${MONTHS[end.getMonth()]} ${end.getFullYear()}`; };
  const cols = { overdue: [], now: [], next: [] };
  let later = 0, undated = 0, done = 0;
  lanes.forEach(l => {
    const rows = l.rows.length ? l.rows : (l.item ? [l.item] : []);
    rows.forEach(r => {
      const s = effStatus(r), sp = spanOf(r);
      const key = sp.end || sp.start;
      if (isClosed(s)) { if (key && key >= Q0.from && key < Q2.from) done++; return; }
      if (!key) { undated++; return; }
      const entry = { item: r, lane: l, sp, key };
      if (sp.end && sp.end < todayIso) cols.overdue.push(entry);
      else if (key < Q1.from) cols.now.push(entry);
      else if (key < Q2.from) cols.next.push(entry);
      else later++;
    });
  });
  const card = e => {
    const r = e.item, s = effStatus(r), sp = e.sp, meta = STATUS_META[s];
    const d = sp.end ? daysUntil(sp.end) : null;
    const due = sp.end
      ? `<span class="due ${d < 0 ? 'over' : d <= 7 ? 'soon' : 'later'}">${d < 0 ? `Overdue ${-d}d` : d === 0 ? 'Due today' : `Due ${fmtShort(sp.end)} · ${d}d`}</span>`
      : `<span class="due later">Starts ${fmtShort(sp.start)}</span>`;
    const started = sp.start && sp.end && sp.start <= todayIso ? `<span class="tag derived">Started ${fmtShort(sp.start)}</span>` : '';
    const tag = canEdit() ? 'button' : 'div';
    return `<${tag} class="icard qcard" ${canEdit() ? `type="button" data-act="edit-item" data-id="${r.id}"` : ''} style="--sc:${meta.color}" title="${esc(pathText(r))}">
      <div class="ihead"><div class="name"><span class="code">${!cur && !r.parentId ? 'Track ' : ''}${codeOf(r)}</span>${esc(r.name)}</div></div>
      <div class="ctrls">${statusPill(s)}${due}${started}</div>
      ${r.owner ? `<div class="meta-line">👤 ${esc(r.owner)}</div>` : ''}
    </${tag}>`;
  };
  const colHTML = (title, sub, list, color, emptyText) => {
    list.sort((a, b) => a.key.localeCompare(b.key));
    // group by lane (track, or initiative on the overview) in lane order
    const groups = lanes.map(l => ({ l, items: list.filter(e => e.lane === l) })).filter(g => g.items.length);
    return `<section class="tcol qcol" aria-label="${esc(title)}">
      <div class="tcol-head" style="--tc:${color}">
        <div class="ihead"><div class="t name">${esc(title)}</div><span class="pct" style="font-weight:700">${list.length}</span></div>
        <div class="meta-line">${esc(sub)}</div>
      </div>
      <div class="tcol-body" data-scroll-key="q-${title}">${groups.length ? groups.map(g => `<div class="qgroup"><div class="group-label">${esc(g.l.title)}</div>${g.items.map(card).join('')}</div>`).join('') : `<div class="tcol-empty">${emptyText}</div>`}</div>
    </section>`;
  };
  const total = cols.overdue.length + cols.now.length + cols.next.length;
  queueMicrotask(() => { const m = document.getElementById('countMeta'); if (m) m.textContent = `${total} open item${total === 1 ? '' : 's'} due by the end of ${qLabel(Q1)}`; });
  const notes = [
    done ? `${done} completed this period` : '',
    later ? `${later} due after ${qLabel(Q1)}` : '',
    undated ? `${undated} without dates` : '',
  ].filter(Boolean).join(' · ');
  return `
    <div class="rm-tools">
      ${rmViewSeg()}
      <span class="meta-line" style="margin:0">Open items, placed by deadline${notes ? ` · ${notes} (see Timeline)` : ''}</span>
    </div>
    <div class="tboard qboard" data-scroll-key="quarters:${ui.view}:${ui.track}">
      ${cols.overdue.length ? colHTML('Overdue', 'Past their deadline and not completed', cols.overdue, 'var(--danger)', '') : ''}
      ${colHTML(`This quarter · ${qLabel(Q0)}`, qRange(Q0, Q1), cols.now, 'var(--primary)', 'Nothing due this quarter.')}
      ${colHTML(`Next quarter · ${qLabel(Q1)}`, qRange(Q1, Q2), cols.next, 'var(--s-ut)', 'Nothing due next quarter yet.')}
    </div>`;
}

function scrollRoadmapToToday(el) {
  el = el || document.querySelector('.rm');
  if (el) el.scrollLeft = Math.max(0, Number(el.dataset.todayX) - 60);
}

function progressLine(item) {
  const st = stats(leavesUnder(item));
  return `<div class="meta-line" style="justify-content:space-between"><span>${st.done}/${st.live} done</span><b style="color:var(--ink)">${st.pct}%</b></div>
    <div class="mini-bar" aria-hidden="true"><div style="width:${st.pct}%"></div></div>`;
}

function trackColumn(t, cardsHTML) {
  const s = effStatus(t), kids = hasKids(t);
  return `<section class="tcol" aria-label="Track ${esc(codeOf(t))} ${esc(t.name)}">
    <div class="tcol-head ${isClosed(s) ? 'done' : ''}" style="--tc:${STATUS_META[s].color}">
      <div class="ihead">
        <input type="checkbox" class="cb" data-act="done" data-id="${t.id}" ${s === 'Completed' ? 'checked' : ''} ${kids ? 'disabled title="Completes automatically when all sub-items are completed"' : canEdit() ? '' : 'disabled'} aria-label="Mark track completed">
        <div class="t name"><span class="code">Track ${codeOf(t)}</span>${esc(t.name)}</div>
      </div>
      ${itemMeta(t)}
      ${kids ? progressLine(t) : ''}
      <div class="ctrls">${statusSelect(t)}${dueChip(t)}</div>
      ${canEdit() ? `<div class="ctrls">${dateInput(t)}<span class="grow"></span>
        <button class="btn sm ghost" data-act="add-item" data-init="${t.initiativeId}" data-parent="${t.id}" title="Add a sub-item to this track">+ Sub</button>
        <button class="btn sm" data-act="edit-item" data-id="${t.id}">Edit</button></div>` : ''}
    </div>
    <div class="tcol-body" data-scroll-key="col-${t.id}">${cardsHTML || (kids ? '<div class="tcol-empty">No sub-items match the filters.</div>' : canEdit() ? '' : '<div class="tcol-empty">No sub-items yet.</div>')}</div>
    ${canEdit() ? quickAddHTML(t.initiativeId, t.id) : ''}
  </section>`;
}

function initiativeColumn(init, cardsHTML) {
  const tracks = tracksOf(init.id), low = lowestStatus(tracks);
  const st = stats(leavesOfInit(init.id));
  return `<section class="tcol" aria-label="${esc(init.name)}">
    <div class="tcol-head" style="--tc:${low ? STATUS_META[low].color : 'var(--border-strong)'}">
      <div class="ihead"><div class="t name"><a href="#" data-act="view" data-view="${init.id}" title="Open ${esc(init.name)}">${esc(init.name)}</a></div>${low ? statusPill(low) : ''}</div>
      ${init.description ? `<div class="meta-line">${esc(init.description)}</div>` : ''}
      <div class="meta-line" style="justify-content:space-between"><span>${st.done}/${st.live} work items done · ${tracks.length} track${tracks.length === 1 ? '' : 's'}</span><b style="color:var(--ink)">${st.pct}%</b></div>
      <div class="mini-bar" aria-hidden="true"><div style="width:${st.pct}%"></div></div>
      ${canEdit() ? `<div class="ctrls"><span class="grow"></span><button class="btn sm ghost" data-act="add-item" data-init="${init.id}">+ Track</button><button class="btn sm" data-act="edit-init" data-id="${init.id}">Edit</button></div>` : ''}
    </div>
    <div class="tcol-body" data-scroll-key="col-${init.id}">${cardsHTML || (tracks.length ? '<div class="tcol-empty">No tracks match the filters.</div>' : canEdit() ? '' : '<div class="tcol-empty">No tracks yet.</div>')}</div>
    ${canEdit() ? quickAddHTML(init.id, null) : ''}
  </section>`;
}

const dateInput = item => `<input type="date" class="dl-input" value="${esc(item.deadline || '')}" data-act="deadline" data-id="${item.id}" title="Deadline" aria-label="Deadline for ${esc(item.name)}" ${canEdit() ? '' : 'disabled'}>`;

function itemMeta(item, opts = {}) {
  const kids = hasKids(item);
  const ls = kids && !opts.noRollup ? stats(leavesUnder(item)) : null;
  const linkTags = (item.links || []).map(l => IDX.initById.get(l)).filter(Boolean).filter(l => l.id !== item.initiativeId)
    .map(l => `<span class="tag link" title="Linked initiative">↔ ${esc(l.name)}</span>`).join('');
  const bits = [
    opts.path ? `<span>${esc(opts.path)}</span>` : '',
    opts.fromTag || '',
    ls ? `<span class="tag derived" title="Status rolled up from sub-items">${ls.done}/${ls.live} sub-items done</span>` : '',
    item.owner ? `<span>👤 ${esc(item.owner)}</span>` : '',
    linkTags,
    item.notes ? `<span title="${esc(item.notes)}">📝 ${esc(item.notes.length > 60 ? item.notes.slice(0, 60) + '…' : item.notes)}</span>` : '',
  ].filter(Boolean).join('');
  return bits ? `<div class="meta-line">${bits}</div>` : '';
}

// One card: the item, its controls, and its sub-items (any depth) as compact rows.
function itemCard(item, opts, show) {
  const s = effStatus(item), kids = hasKids(item), collapsed = ui.collapsed.includes(item.id);
  const linkedInto = opts.linkedInto;
  const fromTag = linkedInto ? `<span class="tag">From ${esc(IDX.initById.get(item.initiativeId)?.name || 'another initiative')}</span>` : '';
  const title = opts.trackCard
    ? `<a href="#" data-act="open-track" data-init="${item.initiativeId}" data-id="${item.id}" title="Open this track"><span class="code">Track ${codeOf(item)}</span>${esc(item.name)}</a>`
    : `<span class="code">${codeOf(item)}</span>${esc(item.name)}`;
  const subRows = [];
  const walk = (parent, depth) => childrenOf(parent.id).filter(show).forEach(c => { subRows.push(subRow(c, depth)); if (!ui.collapsed.includes(c.id) || filtersActive()) walk(c, depth + 1); });
  if (kids && (!collapsed || filtersActive())) walk(item, 0);
  const nSubs = descendants(item).length;
  return `<article class="icard ${isClosed(s) ? 'done' : ''}" style="--sc:${STATUS_META[s].color}">
    <div class="ihead">
      <input type="checkbox" class="cb" data-act="done" data-id="${item.id}" ${s === 'Completed' ? 'checked' : ''} ${kids ? 'disabled title="Completes automatically when all sub-items are completed"' : canEdit() ? '' : 'disabled'} aria-label="Mark completed">
      <div class="name">${title}</div>
    </div>
    ${itemMeta(item, { path: linkedInto ? pathText(item) : '', fromTag })}
    <div class="ctrls">${statusSelect(item)}${dueChip(item)}</div>
    ${canEdit() ? `<div class="ctrls">${dateInput(item)}<span class="grow"></span>
      ${linkedInto ? `<button class="btn sm ghost" data-act="unlink" data-id="${item.id}" data-init="${linkedInto.id}" title="Stop showing this item in ${esc(linkedInto.name)}">Unlink</button>` : ''}
      <button class="btn sm ghost" data-act="add-item" data-init="${item.initiativeId}" data-parent="${item.id}" title="Add sub-item under ${esc(codeOf(item))}">+ Sub</button>
      <button class="btn sm" data-act="edit-item" data-id="${item.id}">Edit</button></div>`
      : (item.deadline ? `<div class="meta-line">Deadline ${esc(fmtDate(item.deadline))}</div>` : '')}
    ${kids ? `<div class="subs">
      <button class="toggle" data-act="collapse" data-id="${item.id}" aria-expanded="${!collapsed}" style="align-self:flex-start">${collapsed ? '▶' : '▼'} ${nSubs} sub-item${nSubs === 1 ? '' : 's'}</button>
      ${subRows.join('')}</div>` : ''}
  </article>`;
}

function subRow(item, depth) {
  const s = effStatus(item), kids = hasKids(item), collapsed = ui.collapsed.includes(item.id);
  return `<div class="srow ${isClosed(s) ? 'done' : ''}" style="padding-left:${depth * 16}px">
    ${kids ? `<button class="toggle" data-act="collapse" data-id="${item.id}" aria-label="${collapsed ? 'Expand' : 'Collapse'} ${esc(codeOf(item))}" style="padding:0 2px">${collapsed ? '▶' : '▼'}</button>` : ''}
    <input type="checkbox" class="cb" data-act="done" data-id="${item.id}" ${s === 'Completed' ? 'checked' : ''} ${kids ? 'disabled title="Completes automatically when all sub-items are completed"' : canEdit() ? '' : 'disabled'} aria-label="Mark ${esc(codeOf(item))} completed">
    <span class="nm" title="${esc(item.name)}${item.notes ? ' — ' + esc(item.notes) : ''}"><span class="code">${codeOf(item)}</span>${esc(item.name)} ${dueChip(item)}</span>
    ${statusSelect(item)}
    ${canEdit() ? `<button class="btn sm ghost" data-act="edit-item" data-id="${item.id}" aria-label="Edit ${esc(codeOf(item))}">Edit</button>` : ''}
  </div>`;
}

function renderBoard(cur) {
  // Every work item gets a card, including items that have sub-items (shown with their
  // rolled-up status). Tracks that have sub-items are left out: the sidebar and
  // checklist already show them, and their sub-items are on the board.
  const onBoard = i => !(hasKids(i) && !i.parentId);
  const withSubtree = i => [i, ...descendants(i)];
  let cards = rootsInScope(cur).flatMap(withSubtree).filter(onBoard);
  if (cur && ui.track === 'all') {
    const seen = new Set(cards);
    // A linked item always gets its own card, even a track, so it can be unlinked here.
    linkedRoots(cur).forEach(l => withSubtree(l).forEach(x => { if (!seen.has(x) && (x === l || onBoard(x))) { seen.add(x); cards.push(x); } }));
  }
  cards = cards.filter(matches);
  const cols = STATUSES.filter(s => !(ui.hideDone && isClosed(s)) && (ui.status === 'all' || ui.status === s));
  queueMicrotask(() => { const m = document.getElementById('countMeta'); if (m) m.textContent = `${cards.length} card${cards.length === 1 ? '' : 's'}${canEdit() ? ' · drag cards to change status' : ''}`; });
  return `<div class="board" data-scroll-key="status-board:${ui.view}:${ui.track}">${cols.map(s => {
    const items = cards.filter(l => effStatus(l) === s);
    return `<div class="col" data-drop="${s}">
      <div class="col-head"><span><span class="dot" style="background:${STATUS_META[s].color}"></span>${s}</span><span style="color:var(--muted)">${items.length}</span></div>
      ${items.map(l => cardHTML(l, s, cur)).join('')}
    </div>`;
  }).join('')}</div>`;
}

function cardHTML(l, s, cur) {
  const kids = hasKids(l);
  const ls = kids ? stats(leavesUnder(l)) : null;
  const src = cur ? linkSource(l, cur.id) : null;
  const draggable = canEdit() && !kids; // a parent's status comes from its sub-items
  const linkTags = (l.links || []).filter(x => x !== l.initiativeId).map(x => IDX.initById.get(x)).filter(Boolean).map(x => ` <span class="tag link">↔ ${esc(x.name)}</span>`).join('');
  const linkedTag = src ? (src === l ? ' <span class="tag">linked</span>' : ` <span class="tag" title="Shown here because ${esc(codeOf(src))} is linked">via ${esc(codeOf(src))}</span>`) : '';
  return `<div class="bcard ${isClosed(s) ? 'done' : ''}" ${draggable ? `draggable="true" data-drag="${l.id}"` : 'style="cursor:default"'}>
    <div style="display:flex;gap:8px;justify-content:space-between;align-items:flex-start">
      <div class="name"><span class="code">${codeOf(l)}</span>${esc(l.name)}</div>
      <input type="checkbox" class="cb" data-act="done" data-id="${l.id}" ${s === 'Completed' ? 'checked' : ''} ${kids ? 'disabled title="Completes automatically when all sub-items are completed"' : canEdit() ? '' : 'disabled'}>
    </div>
    <div class="path">${esc(pathText(l))}${linkedTag}${linkTags}${kids ? ` <span class="tag derived" title="Status rolled up from sub-items">${ls.done}/${ls.live} sub-items done</span>` : ''}</div>
    <div class="foot">${statusSelect(l)}${dueChip(l)}${canEdit() ? `${src === l ? `<button class="btn sm ghost" data-act="unlink" data-id="${l.id}" data-init="${cur.id}" title="Stop showing this item in ${esc(cur.name)}">Unlink</button>` : ''}<button class="btn sm" data-act="edit-item" data-id="${l.id}">Edit</button>` : ''}</div>
  </div>`;
}

/* --------------------------------------------------------------- modals */
function openModal(html, onMount) {
  closeModal();
  const bd = document.createElement('div');
  bd.className = 'backdrop'; bd.id = 'modal';
  bd.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  bd.addEventListener('mousedown', e => { if (e.target === bd) closeModal(); });
  document.body.appendChild(bd);
  onMount && onMount(bd);
  const f = bd.querySelector('input[type=text]'); f && f.focus();
}
function closeModal() { document.getElementById('modal')?.remove(); }
function confirmDialog(message, okLabel, onOk, onCancel) {
  openModal(`
    <header><h3>Please confirm</h3></header>
    <div class="body"><p class="confirm-text">${esc(message)}</p></div>
    <footer><span></span><div style="display:flex;gap:8px"><button class="btn" data-no>Cancel</button><button class="btn primary" data-yes>${esc(okLabel)}</button></div></footer>`, bd => {
    bd.querySelector('[data-no]').onclick = () => { closeModal(); onCancel && onCancel(); };
    bd.querySelector('[data-yes]').onclick = () => { closeModal(); onOk(); };
    bd.querySelector('[data-yes]').focus();
  });
}

function itemModal({ id, initiativeId, parentId }) {
  const item = id ? IDX.byId.get(id) : null;
  const initId = item ? item.initiativeId : initiativeId;
  const init = IDX.initById.get(initId);
  const pId = item ? item.parentId : (parentId || null);
  const kids = item && hasKids(item);
  const banned = new Set(item ? [item.id, ...descendants(item).map(d => d.id)] : []);
  const parentOptions = [];
  const walk = (list, depth) => list.forEach(i => { if (!banned.has(i.id)) { parentOptions.push(`<option value="${i.id}" ${i.id === pId ? 'selected' : ''}>${'  '.repeat(depth)}${esc(codeOf(i))} ${esc(i.name)}</option>`); walk(childrenOf(i.id), depth + 1); } });
  walk(tracksOf(initId), 0);
  const parent = pId && IDX.byId.get(pId);
  const heading = item ? `Edit ${depthOf(item) === 0 ? 'track' : 'item'} ${codeOf(item)}` : (parent ? `Add sub-item under ${codeOf(parent)}` : `Add track to ${esc(init?.name || '')}`);
  const status = item ? item.status : (parent ? 'Thoughts' : 'Thoughts');
  const others = initiatives().filter(i => i.id !== initId);

  openModal(`
    <header><h3>${heading}</h3><button class="btn ghost sm" data-close>✕</button></header>
    <div class="body">
      <div class="field"><label>Name</label><input type="text" name="name" value="${esc(item?.name || '')}" placeholder="${parent ? 'e.g. Debtor Report' : 'e.g. Debt Management'}"></div>
      <div class="field"><label>Parent</label>
        <select name="parentId"><option value="">— Top-level track in ${esc(init?.name || '')} —</option>${parentOptions.join('')}</select>
        <div class="help">Nest as deep as you need (Track 1 → 1a → 1a.1 → 1a.1.1 …). Numbering updates automatically.</div>
      </div>
      <div class="two">
        <div class="field"><label>Status</label>
          <select name="status" ${kids ? 'disabled' : ''}>${STATUSES.map(s => `<option ${s === (kids ? effStatus(item) : status) ? 'selected' : ''}>${s}</option>`).join('')}</select>
          ${kids ? `<div class="help">Rolled up from sub-items (lowest status). Change a sub-item to update it.</div>` : ''}
        </div>
        <div class="field"><label>Deadline</label><input type="date" name="deadline" value="${esc(item?.deadline || '')}"><div class="help" data-due></div></div>
      </div>
      ${store.hasStartDate ? `<div class="two">
        <div class="field"><label for="startDate">Start date</label><input type="date" id="startDate" name="startDate" value="${esc(item?.startDate || '')}">
          <div class="help">With a deadline, places this item as a bar on the roadmap.</div></div>
        <div class="field"></div>
      </div>` : ''}
      <div class="field"><label>Owner</label><input type="text" name="owner" value="${esc(item?.owner || '')}" placeholder="Optional"></div>
      <div class="field"><label>Notes</label><textarea name="notes" placeholder="Optional">${esc(item?.notes || '')}</textarea></div>
      ${others.length ? `<div class="field"><label>Also linked to initiative</label><div class="checks">${others.map(o => `<label><input type="checkbox" name="links" value="${o.id}" ${(item?.links || []).includes(o.id) ? 'checked' : ''}> ${esc(o.name)}</label>`).join('')}</div>
        <div class="help">Linked items, with their sub-items, also appear on that initiative’s boards.</div>
        ${item ? others.map(o => { const src = ancestors(item).reverse().find(x => (x.links || []).includes(o.id)); return src ? `<div class="help">Also shown in ${esc(o.name)} because its parent ${esc(codeOf(src))} ${esc(src.name)} is linked. Unlink ${esc(codeOf(src))} to remove it there.</div>` : ''; }).join('') : ''}</div>` : ''}
    </div>
    <footer>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${item ? `<button class="btn sm danger" data-del>Delete</button><button class="btn sm" data-move="-1" title="Move up">↑</button><button class="btn sm" data-move="1" title="Move down">↓</button>` : ''}
      </div>
      <div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn primary" data-save>${item ? 'Save' : 'Add'}</button></div>
    </footer>`, bd => {
    const q = n => bd.querySelector(`[name="${n}"]`);
    const showDue = () => {
      const v = q('deadline').value, el = bd.querySelector('[data-due]');
      if (!v) { el.textContent = ''; return; }
      const n = daysUntil(v);
      el.textContent = n < 0 ? `Overdue by ${-n} day${n === -1 ? '' : 's'}` : n === 0 ? 'Due today' : `${n} day${n === 1 ? '' : 's'} from today`;
      el.style.color = n < 0 ? 'var(--danger)' : n <= 7 ? 'var(--warn)' : '';
    };
    q('deadline').addEventListener('input', showDue); showDue();
    bd.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
    bd.querySelector('[data-save]').onclick = () => {
      const name = q('name').value.trim();
      if (!name) { q('name').focus(); toast('Please enter a name.'); return; }
      const startDate = q('startDate') ? q('startDate').value : (item?.startDate || '');
      if (startDate && q('deadline').value && startDate > q('deadline').value) { q('startDate').focus(); toast('The start date must be on or before the deadline.'); return; }
      const links = [...bd.querySelectorAll('[name=links]:checked')].map(x => x.value);
      const newParent = q('parentId').value || null;
      if (item) {
        if (item.parentId !== newParent) { item.parentId = newParent; item.order = nextOrder(initId, newParent); }
        Object.assign(item, { name, startDate, deadline: q('deadline').value, owner: q('owner').value.trim(), notes: q('notes').value.trim(), links });
        if (!kids) { const ns = q('status').value; if (ns === 'Completed' && item.status !== 'Completed') item.prevStatus = item.status; item.status = ns; }
        touch(item);
        commit({ items: [item] });
      } else {
        const now = new Date().toISOString();
        const created = { id: uid(), initiativeId: initId, parentId: newParent, name, status: q('status').value, startDate, deadline: q('deadline').value, owner: q('owner').value.trim(), notes: q('notes').value.trim(), links, order: nextOrder(initId, newParent), createdAt: now, updatedAt: now };
        db.items.push(created); commit({ items: [created] });
        if (newParent) ui.collapsed = ui.collapsed.filter(c => c !== newParent);
      }
      saveUI(); closeModal(); render();
    };
    bd.querySelector('[data-del]')?.addEventListener('click', () => {
      const n = descendants(item).length;
      confirmDialog(`Delete “${item.name}”${n ? ` and its ${n} sub-item${n > 1 ? 's' : ''}` : ''}? This cannot be undone.`, 'Delete', () => deleteItem(item.id), () => itemModal({ id: item.id }));
    });
    bd.querySelectorAll('[data-move]').forEach(b => b.onclick = () => { moveItem(item.id, Number(b.dataset.move)); itemModal({ id: item.id }); });
  });
}

function initModal(id) {
  const init = id ? IDX.initById.get(id) : null;
  const tracks = init ? tracksOf(init.id) : [];
  const linkedIn = init ? db.items.filter(i => i.initiativeId !== init.id && (i.links || []).includes(init.id)) : [];
  const delNote = !init ? '' : tracks.length
    ? `To delete this initiative, first delete its ${tracks.length} track${tracks.length === 1 ? '' : 's'}.`
    : 'This initiative has no tracks, so it can be deleted.';
  openModal(`
    <header><h3>${init ? 'Edit initiative' : 'New initiative'}</h3><button class="btn ghost sm" data-close>✕</button></header>
    <div class="body">
      <div class="field"><label for="initName">Name</label><input type="text" id="initName" name="name" value="${esc(init?.name || '')}" placeholder="e.g. POLARIS">
        ${init ? '<div class="help">Renaming keeps all tracks, items, links and progress.</div>' : ''}</div>
      <div class="field"><label for="initDesc">Description</label><input type="text" id="initDesc" name="description" value="${esc(init?.description || '')}" placeholder="Optional one-liner"></div>
      <div class="help" data-err style="color:var(--danger)" hidden></div>
      ${init ? `<div class="help" data-delnote>${delNote}</div>` : ''}
    </div>
    <footer>
      <div style="display:flex;gap:6px">${init ? `<button class="btn sm danger" data-del ${tracks.length ? 'disabled title="Delete its tracks first"' : ''}>Delete initiative</button><button class="btn sm" data-move="-1" title="Move left">←</button><button class="btn sm" data-move="1" title="Move right">→</button>` : ''}</div>
      <div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn primary" data-save>${init ? 'Save' : 'Create'}</button></div>
    </footer>`, bd => {
    const err = m => { const e = bd.querySelector('[data-err]'); e.textContent = m; e.hidden = !m; };
    bd.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
    bd.querySelector('[data-save]').onclick = () => {
      const name = bd.querySelector('[name=name]').value.trim();
      const description = bd.querySelector('[name=description]').value.trim();
      if (!name) { err('Enter a name for the initiative.'); bd.querySelector('[name=name]').focus(); return; }
      const clash = db.initiatives.find(i => i.id !== init?.id && i.name.trim().toLowerCase() === name.toLowerCase());
      if (clash) { err(`An initiative called “${clash.name}” already exists. Choose a different name.`); return; }
      if (init) { Object.assign(init, { name, description }); commit({ inits: [init] }); toast(`Saved ${name}.`); }
      else { const n = { id: uid(), name, description, order: db.initiatives.length ? Math.max(...db.initiatives.map(i => i.order ?? 0)) + 1 : 0, createdAt: new Date().toISOString() }; db.initiatives.push(n); commit({ inits: [n] }); ui.view = n.id; ui.track = 'all'; }
      saveUI(); closeModal(); render();
    };
    bd.querySelector('[data-del]')?.addEventListener('click', () => {
      // Re-check against the latest data: someone may have added a track meanwhile.
      index();
      const left = tracksOf(init.id).length;
      if (left) { err(`“${init.name}” still has ${left} track${left === 1 ? '' : 's'}. Delete ${left === 1 ? 'it' : 'them'} first.`); return; }
      const linkNote = linkedIn.length ? ` ${linkedIn.length} item${linkedIn.length === 1 ? '' : 's'} from other initiatives linked to it will be unlinked.` : '';
      confirmDialog(`Delete initiative “${init.name}”? It has no tracks.${linkNote}`, 'Delete initiative', () => {
        db.initiatives = db.initiatives.filter(i => i.id !== init.id);
        const relinked = db.items.filter(i => (i.links || []).includes(init.id));
        relinked.forEach(i => { i.links = i.links.filter(l => l !== init.id); touch(i); });
        commit({ items: relinked, delInits: [init.id] }).then(ok => { if (ok) toast(`Deleted ${init.name}.`); });
        ui.view = 'overview'; ui.track = 'all'; saveUI(); render();
      }, () => initModal(init.id));
    });
    bd.querySelectorAll('[data-move]').forEach(b => b.onclick = () => {
      const list = initiatives(); const i = list.indexOf(init), j = i + Number(b.dataset.move);
      if (j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]]; list.forEach((x, k) => x.order = k); commit({ inits: list }); render();
    });
  });
}

/* --------------------------------------------------------------- export */
function rowsForExport() {
  const rows = [];
  const walk = (item, depth) => {
    const d = dueInfo(item), dl = effDeadline(item), init = IDX.initById.get(item.initiativeId), track = trackOf(item);
    rows.push({
      'Initiative': init?.name || '',
      'Track': `${codeOf(track)}. ${track.name}`,
      'Code': codeOf(item),
      'Item': '    '.repeat(depth) + item.name,
      'Level': depth === 0 ? 'Track' : `Sub-item (level ${depth})`,
      'Has sub-items': hasKids(item) ? 'Yes' : 'No',
      'Status': effStatus(item),
      'Status source': hasKids(item) ? 'Rolled up (lowest of sub-items)' : 'Set directly',
      'Start date': item.startDate ? fmtDate(item.startDate) : '',
      'Deadline': dl.date ? fmtDate(dl.date) + (dl.inherited ? ' (earliest sub-item)' : '') : '',
      'Days to deadline': d && !isClosed(effStatus(item)) ? d.n : '',
      'Deadline status': d ? d.text : '',
      'Owner': item.owner || '',
      'Linked initiatives': (item.links || []).map(l => IDX.initById.get(l)?.name).filter(Boolean).join(', '),
      'Notes': item.notes || '',
      'Last updated': item.updatedAt ? new Date(item.updatedAt).toLocaleString() : '',
    });
    childrenOf(item.id).forEach(c => walk(c, depth + 1));
  };
  initiatives().forEach(i => tracksOf(i.id).forEach(t => walk(t, 0)));
  return rows;
}
function summaryRows() {
  const rows = [];
  const all = stats(allLeaves());
  rows.push({ 'Initiative': 'PROJECT AHA (all)', 'Track': '', 'Status (lowest)': lowestStatus(initiatives().flatMap(i => tracksOf(i.id))) || '', 'Work items': all.total, 'Completed': all.done, 'Void': all.counts.Void, 'Progress %': all.pct, ...Object.fromEntries(STATUSES.map(s => [s, all.counts[s]])) });
  initiatives().forEach(i => {
    const st = stats(leavesOfInit(i.id));
    rows.push({ 'Initiative': i.name, 'Track': '(all tracks)', 'Status (lowest)': lowestStatus(tracksOf(i.id)) || '', 'Work items': st.total, 'Completed': st.done, 'Void': st.counts.Void, 'Progress %': st.pct, ...Object.fromEntries(STATUSES.map(s => [s, st.counts[s]])) });
    tracksOf(i.id).forEach(t => {
      const ts = stats(leavesUnder(t));
      rows.push({ 'Initiative': i.name, 'Track': `${codeOf(t)}. ${t.name}`, 'Status (lowest)': effStatus(t), 'Work items': ts.total, 'Completed': ts.done, 'Void': ts.counts.Void, 'Progress %': ts.pct, ...Object.fromEntries(STATUSES.map(s => [s, ts.counts[s]])) });
    });
  });
  return rows;
}
function stamp() { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; }
function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function exportExcel() {
  index();
  const items = rowsForExport(), summary = summaryRows();
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    const add = (rows, name, widths) => { const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = widths.map(w => ({ wch: w })); ws['!autofilter'] = { ref: ws['!ref'] }; XLSX.utils.book_append_sheet(wb, ws, name); };
    add(summary, 'Summary', [26, 36, 16, 11, 11, 7, 11, ...STATUSES.map(() => 12)]);
    add(items, 'Work items', [22, 34, 8, 60, 18, 12, 14, 30, 30, 15, 22, 18, 26, 40, 20]);
    initiatives().forEach(i => {
      const rows = items.filter(r => r.Initiative === i.name);
      if (rows.length) add(rows, i.name.replace(/[\\/?*[\]:]/g, ' ').slice(0, 31), [22, 34, 8, 60, 18, 12, 14, 30, 30, 15, 22, 18, 26, 40, 20]);
    });
    const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    download(`Project_AHA_${stamp()}.xlsx`, new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  } else {
    // Offline fallback: CSV opens directly in Excel.
    const cols = Object.keys(items[0] || {});
    const csv = [cols, ...items.map(r => cols.map(c => r[c]))].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    download(`Project_AHA_${stamp()}.csv`, new Blob(['﻿' + csv], { type: 'text/csv' }));
    toast('Excel library unavailable offline — exported CSV instead (opens in Excel).');
  }
}
function backup() { download(`Project_AHA_backup_${stamp()}.json`, new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' })); }
function restore(file) {
  const r = new FileReader();
  r.onload = () => {
    let data;
    try {
      data = JSON.parse(r.result);
      if (!Array.isArray(data.initiatives) || !Array.isArray(data.items)) throw new Error('bad shape');
    } catch { showError('That file is not a valid Project AHA backup. Choose a .json file made with the Backup button.'); return; }
    confirmDialog(`Replace all current data with this backup (${data.initiatives.length} initiatives, ${data.items.length} items)? This changes the tracker for everyone.`, 'Replace data', async () => {
      // Backups from before the move to Supabase used short ids like "orion"; give those new UUIDs.
      const ids = new Map();
      const map = id => (id == null || id === '') ? null : isUuid(id) ? id : (ids.has(id) ? ids.get(id) : (ids.set(id, uid()), ids.get(id)));
      const inits = data.initiatives.map(x => ({ ...x, id: map(x.id) }));
      const items = data.items.map(x => ({ ...x, id: map(x.id), initiativeId: map(x.initiativeId), parentId: map(x.parentId), links: (x.links || []).map(map) }));
      const delInits = db.initiatives.map(i => i.id).filter(id => !inits.some(x => x.id === id));
      const delItems = db.items.map(i => i.id).filter(id => !items.some(x => x.id === id));
      db = { initiatives: inits, items };
      ui.view = 'overview'; ui.track = 'all'; saveUI(); render();
      if (await commit({ delItems, delInits, inits, items })) toast('Backup restored.');
    });
  };
  r.readAsText(file);
}

let toastTimer;
function toast(msg) { document.querySelector('.toast')?.remove(); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200); }

/* --------------------------------------------------------------- events */
const app = document.getElementById('app');
const EDIT_ACTIONS = new Set(['add-item', 'edit-item', 'add-init', 'edit-init', 'restore', 'unlink', 'qa-open']);
app.addEventListener('click', e => {
  const authBtn = e.target.closest('[data-auth]');
  if (authBtn) { if (authBtn.dataset.auth === 'forgot') forgotPassword(); else { auth.screen = 'signin'; auth.message = ''; render(); } return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (EDIT_ACTIONS.has(a) && !canEdit()) return;
  if (a === 'sign-out') { signOut(); return; }
  if (a === 'view') { e.preventDefault(); quickAdd.key = null; ui.view = el.dataset.view; ui.track = 'all'; saveUI(); render(); window.scrollTo({ top: 0 }); }
  else if (a === 'track') { ui.track = el.dataset.id; saveUI(); render(); }
  else if (a === 'mode') { ui.mode = el.dataset.mode; normalizeMode(); saveUI(); render(); }
  else if (a === 'collapse') { const id = el.dataset.id; ui.collapsed = ui.collapsed.includes(id) ? ui.collapsed.filter(x => x !== id) : [...ui.collapsed, id]; saveUI(); render(); }
  else if (a === 'add-item') itemModal({ initiativeId: el.dataset.init, parentId: el.dataset.parent });
  else if (a === 'edit-item') itemModal({ id: el.dataset.id });
  else if (a === 'unlink') unlinkItem(el.dataset.id, el.dataset.init);
  else if (a === 'qa-open') openQuickAdd(el.dataset.key);
  else if (a === 'rm-zoom') { ui.rmZoom = el.dataset.zoom; saveUI(); render(); }
  else if (a === 'rm-today') scrollRoadmapToToday();
  else if (a === 'rm-lane') { const k = el.dataset.key; ui.rmCollapsed = ui.rmCollapsed.includes(k) ? ui.rmCollapsed.filter(x => x !== k) : [...ui.rmCollapsed, k]; saveUI(); render(); }
  else if (a === 'qa-close') closeQuickAdd();
  else if (a === 'open-track') { e.preventDefault(); ui.view = el.dataset.init; ui.track = el.dataset.id; ui.mode = 'tracks'; saveUI(); render(); window.scrollTo({ top: 0 }); }
  else if (a === 'add-init') initModal();
  else if (a === 'edit-init') initModal(el.dataset.id);
  else if (a === 'export-xlsx') exportExcel();
  else if (a === 'backup') backup();
  else if (a === 'restore') document.getElementById('importFile').click();
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'authForm' && !auth.busy) handleAuthSubmit(e.target);
  else if (e.target.matches('[data-qa-form]') && canEdit()) submitQuickAdd(e.target);
});
app.addEventListener('change', e => {
  const el = e.target; const a = el.dataset.act; if (!a) return;
  if ((a === 'status' || a === 'deadline' || a === 'done') && !canEdit()) { render(); return; }
  if (a === 'status') setStatus(el.dataset.id, el.value);
  else if (a === 'deadline') setDeadline(el.dataset.id, el.value);
  else if (a === 'done') toggleDone(el.dataset.id, el.checked);
  else if (a === 'filter-status') { ui.status = el.value; saveUI(); render(); }
  else if (a === 'hide-done') { ui.hideDone = el.checked; saveUI(); render(); }
  else if (a === 'overdue-only') { ui.overdueOnly = el.checked; saveUI(); render(); }
  else if (a === 'rm-unscheduled') { ui.rmUnscheduled = el.checked; saveUI(); render(); }
});
let searchTimer;
app.addEventListener('input', e => {
  if (e.target.matches('[data-qa-input]')) { quickAdd.value = e.target.value; return; }
  if (e.target.dataset.act !== 'search') return;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    ui.search = e.target.value; saveUI(); render();
    const s = app.querySelector('[data-act=search]'); s.focus(); s.setSelectionRange(s.value.length, s.value.length);
  }, 200);
});
// Board drag & drop
app.addEventListener('dragstart', e => { if (!canEdit()) return; const c = e.target.closest('[data-drag]'); if (!c) return; e.dataTransfer.setData('text/plain', c.dataset.drag); c.classList.add('dragging'); });
app.addEventListener('dragend', e => e.target.closest?.('[data-drag]')?.classList.remove('dragging'));
app.addEventListener('dragover', e => { const col = e.target.closest('[data-drop]'); if (!col) return; e.preventDefault(); app.querySelectorAll('.col.over').forEach(c => c !== col && c.classList.remove('over')); col.classList.add('over'); });
app.addEventListener('dragleave', e => { const col = e.target.closest('[data-drop]'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
app.addEventListener('drop', e => { const col = e.target.closest('[data-drop]'); if (!col) return; e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); if (id && canEdit() && IDX.byId.has(id) && !hasKids(IDX.byId.get(id))) setStatus(id, col.dataset.drop); });

document.getElementById('importFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) restore(f); e.target.value = ''; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (document.getElementById('modal')) closeModal(); else closeQuickAdd(); } });

initAuth();
</script>
</body>
