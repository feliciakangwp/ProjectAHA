<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project AHA Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
  /* Layout: summary tiles on top, then a track sidebar beside a checklist / board work area. */
  :root {
    --bg: #eef2f6; --surface: #ffffff; --surface-2: #f6f8fb; --border: #dfe5ec; --border-strong: #c5cfdb;
    --ink: #0f1b2d; --ink-2: #33415a; --muted: #5f6d82; --faint: #8f9bad;
    --primary: #1f5fd6; --primary-ink: #ffffff; --primary-soft: #eaf1fd;
    --inverse: #0f1b2d; --inverse-ink: #ffffff; --inverse-muted: #b9c4d3;
    --danger: #b42318; --danger-soft: #fdf0ee; --warn: #a15c07; --warn-soft: #fef7e6; --warn-line: #f5d58a;
    --info-soft: #ecf8f6; --info-ink: #13574f; --info-line: #a6dfd6;
    --tag-bg: #edf0fb; --tag-ink: #33408f; --track: #e2e8ef; --col: #e6ecf3;
    --s-thoughts: #64748b; --s-thoughts-bg: #eef1f5; --s-thoughts-ink: #475569;
    --s-pending: #d97706; --s-pending-bg: #fef6e7; --s-pending-ink: #a15c07;
    --s-planning: #0891b2; --s-planning-bg: #e8f8fb; --s-planning-ink: #0e6a85;
    --s-dev: #ea580c; --s-dev-bg: #fff2e8; --s-dev-ink: #b8430b;
    --s-it: #2563eb; --s-it-bg: #ebf2fe; --s-it-ink: #1d4ed8;
    --s-ut: #7c3aed; --s-ut-bg: #f3effe; --s-ut-ink: #6d28d9;
    --s-done: #047857; --s-done-bg: #e8f7f0; --s-done-ink: #047857;
    --s-void: #a8a29e; --s-void-bg: #f3f2f1; --s-void-ink: #78716c;
    --font: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --radius: 12px; --shadow: 0 1px 2px rgba(15,27,45,.06);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0d141f; --surface: #151e2b; --surface-2: #1b2636; --border: #283547; --border-strong: #3a4a60;
    --ink: #e8eef6; --ink-2: #c3cedc; --muted: #93a1b5; --faint: #6c7a8f;
    --primary: #5b93f5; --primary-ink: #0b1220; --primary-soft: #1a2a45;
    --inverse: #e8eef6; --inverse-ink: #0d141f; --inverse-muted: #4b5a70;
    --danger: #f2877b; --danger-soft: #3a1c1a; --warn: #f0b75a; --warn-soft: #33270f; --warn-line: #5c4615;
    --info-soft: #11302c; --info-ink: #8adbd0; --info-line: #1f5149;
    --tag-bg: #242c4a; --tag-ink: #b4bef0; --track: #283547; --col: #111a26;
    --s-thoughts: #94a3b8; --s-thoughts-bg: #232e3d; --s-thoughts-ink: #b8c3d1;
    --s-pending: #f0a33a; --s-pending-bg: #35270f; --s-pending-ink: #f5bf6a;
    --s-planning: #2fb8d8; --s-planning-bg: #0f2f38; --s-planning-ink: #7dd6ea;
    --s-dev: #f57b3a; --s-dev-bg: #3a2113; --s-dev-ink: #fba277;
    --s-it: #5b93f5; --s-it-bg: #182a4a; --s-it-ink: #9cbcf8;
    --s-ut: #a07cf3; --s-ut-bg: #2a1f47; --s-ut-ink: #c4adf8;
    --s-done: #34b383; --s-done-bg: #10332a; --s-done-ink: #6fd3ab;
    --s-void: #8a8580; --s-void-bg: #262422; --s-void-ink: #a9a49f;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #0d141f; --surface: #151e2b; --surface-2: #1b2636; --border: #283547; --border-strong: #3a4a60;
    --ink: #e8eef6; --ink-2: #c3cedc; --muted: #93a1b5; --faint: #6c7a8f;
    --primary: #5b93f5; --primary-ink: #0b1220; --primary-soft: #1a2a45;
    --inverse: #e8eef6; --inverse-ink: #0d141f; --inverse-muted: #4b5a70;
    --danger: #f2877b; --danger-soft: #3a1c1a; --warn: #f0b75a; --warn-soft: #33270f; --warn-line: #5c4615;
    --info-soft: #11302c; --info-ink: #8adbd0; --info-line: #1f5149;
    --tag-bg: #242c4a; --tag-ink: #b4bef0; --track: #283547; --col: #111a26;
    --s-thoughts: #94a3b8; --s-thoughts-bg: #232e3d; --s-thoughts-ink: #b8c3d1;
    --s-pending: #f0a33a; --s-pending-bg: #35270f; --s-pending-ink: #f5bf6a;
    --s-planning: #2fb8d8; --s-planning-bg: #0f2f38; --s-planning-ink: #7dd6ea;
    --s-dev: #f57b3a; --s-dev-bg: #3a2113; --s-dev-ink: #fba277;
    --s-it: #5b93f5; --s-it-bg: #182a4a; --s-it-ink: #9cbcf8;
    --s-ut: #a07cf3; --s-ut-bg: #2a1f47; --s-ut-ink: #c4adf8;
    --s-done: #34b383; --s-done-bg: #10332a; --s-done-ink: #6fd3ab;
    --s-void: #8a8580; --s-void-bg: #262422; --s-void-ink: #a9a49f;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .mode-note { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .confirm-text { color: var(--ink-2); margin: 0; }
  .userbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .userbar .who { color: var(--ink-2); font-weight: 500; }
  .role { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 6px; }
  .role.edit { background: var(--s-done-bg); color: var(--s-done-ink); }
  .role.view { background: var(--tag-bg); color: var(--tag-ink); }
  .error-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 12px 16px; background: var(--danger-soft); color: var(--danger); border-bottom: 1px solid var(--danger); font-size: 13.5px; }
  .error-bar .msg { flex: 1; min-width: 0; font-weight: 500; }
  .error-bar .btns { display: flex; gap: 6px; flex: none; }
  .auth-wrap { min-height: 80vh; display: grid; place-items: center; padding-block: 40px; }
  .auth-card { width: 100%; max-width: 400px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
  .auth-card h2 { margin: 0; font-size: 22px; }
  .auth-card form { display: flex; flex-direction: column; gap: 14px; }
  .auth-card .field input { width: 100%; border: 1px solid var(--border-strong); border-radius: 8px; padding: 9px 11px; background: var(--surface); }
  .auth-brand { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--primary); font-weight: 600; }
  .auth-sub { margin: 0; color: var(--muted); }
  .auth-msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; }
  .auth-msg.error { background: var(--danger-soft); color: var(--danger); }
  .auth-msg.ok { background: var(--s-done-bg); color: var(--s-done-ink); }
  .btn.block { width: 100%; padding-block: 10px; }
  .btn:disabled { opacity: .6; cursor: progress; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 24px 32px 64px; }

  /* Header + nav */
  .top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; text-wrap: balance; }
  h1, h2, h3 { text-wrap: balance; }
  .sub { color: var(--muted); margin-top: 4px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 8px 14px; white-space: nowrap; }
  .btn:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
    .btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 7px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn.danger { color: var(--danger); }
  .tabs { display: flex; gap: 6px; margin: 20px 0 18px; flex-wrap: wrap; align-items: center; }
  .tab { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 7px 16px; font-weight: 500; }
  .tab.active { background: var(--inverse); color: var(--inverse-ink); border-color: var(--inverse); }
  .tab .n { color: var(--faint); font-size: 12px; margin-left: 6px; }
  .tab.active .n { color: var(--inverse-muted); }
  .tab.add { border-style: dashed; color: var(--primary); }

  /* KPI cards */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .kpi { padding: 18px 20px; }
  .kpi.hero { border: 2px solid var(--primary); }
  .kpi .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
  .kpi .val { font-family: var(--mono); font-size: 30px; font-weight: 700; margin: 6px 0 2px; letter-spacing: -.02em; }
  .kpi .hint { font-size: 12px; color: var(--muted); }
  .kpi .val.bad { color: var(--danger); }

  .banner.info { border-color: var(--info-line); background: var(--info-soft); color: var(--info-ink); }
  .banner { margin: 16px 0; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--warn-line); background: var(--warn-soft); color: var(--warn); font-size: 13px; }

  /* Status */
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  select.status { border: 1px solid transparent; border-radius: 7px; padding: 3px 6px; font-size: 12.5px; font-weight: 600; }
  select.status:disabled { opacity: 1; cursor: not-allowed; }

  /* Overview */
  .section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 28px 0 12px; }
  .section-title h2 { margin: 0; font-size: 19px; }
  .section-title .meta { color: var(--muted); font-size: 13px; }
  .dist { padding: 18px 20px; }
  .stackbar { display: flex; gap: 2px; height: 14px; margin: 10px 0 12px; }
  .stackbar > div { height: 100%; min-width: 4px; }
  .stackbar > div:first-child { border-radius: 4px 0 0 4px; }
  .stackbar > div:last-child { border-radius: 0 4px 4px 0; }
  .stackbar > div:only-child { border-radius: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend b { color: var(--ink); }
  .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
  .inits { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .init { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .init-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .init-head h3 { margin: 0; font-size: 17px; }
  .init-head .desc { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .bar { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--s-done); border-radius: 999px; }
  .prog-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .prog-row b { color: var(--ink); }
  .tracklist { display: flex; flex-direction: column; border-top: 1px solid var(--border); }
  .trackrow { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .trackrow:last-child { border-bottom: 0; }
  .trackrow .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trackrow .c { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .code { color: var(--faint); font-family: var(--mono); font-size: .92em; font-weight: 600; margin-right: 6px; }
  .init.add { align-items: center; justify-content: center; border-style: dashed; color: var(--primary); min-height: 160px; cursor: pointer; background: transparent; }
  .dl { padding: 8px 0; }
  .dl-item { display: flex; justify-content: space-between; gap: 10px; padding: 9px 18px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .dl-item:last-child { border-bottom: 0; }
  .dl-item:hover { background: var(--surface-2); }
  .dl-item .nm { font-weight: 500; }
  .dl-item .path { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 18px; text-align: center; font-size: 13px; }

  /* Due chips */
  .due { font-size: 12px; font-weight: 600; white-space: nowrap; padding: 2px 8px; border-radius: 6px; }
  .due.over { color: var(--danger); background: var(--danger-soft); }
  .due.soon { color: var(--warn); background: var(--warn-soft); }
  .due.later { color: var(--muted); background: var(--surface-2); }
  .due.done { color: var(--faint); }

  /* Work panel */
  .work { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; }
  .work > section { min-width: 0; }
  .side { padding: 16px; position: sticky; top: 12px; }
  .side h4 { margin: 4px 8px 10px; font-size: 11px; letter-spacing: .12em; color: var(--muted); }
  .side-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; }
  .side-item:hover { background: var(--surface-2); }
  .side-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .side-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-item .n { color: var(--faint); font-size: 12px; }
  .side .foot { margin-top: 16px; padding: 12px 8px 0; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .side .foot .big { font-size: 18px; font-weight: 700; color: var(--ink); margin: 4px 0 6px; }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input[type=search] { flex: 1; min-width: 200px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 8px 12px; }
  .toolbar select { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 10px; }
  .toolbar label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: transparent; padding: 8px 16px; }
  .seg button.on { background: var(--inverse); color: var(--inverse-ink); }
  .work-head { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 0 10px; gap: 10px; }
  .work-head h3 { margin: 0; font-size: 18px; }
  .work-head .meta { color: var(--muted); font-size: 13px; }

  /* Checklist */
  .group { margin-bottom: 18px; }
  .init-label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; margin: 22px 0 8px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .row.track { background: var(--surface); border-left: 4px solid var(--ink); }
  .row.done { background: var(--surface-2); }
  .row.done .name, .row.done .code { color: var(--faint); text-decoration: line-through; }
  .row.done .meta-line, .row.done select.status { opacity: .6; }
  .row .main { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; }
  .row.track .name { font-size: 15.5px; }
  .meta-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 3px; font-size: 12px; color: var(--muted); }
  .tag { white-space: nowrap; display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 6px; background: var(--tag-bg); color: var(--tag-ink); font-weight: 500; }
  .tag.link { background: var(--info-soft); color: var(--info-ink); }
  .tag.derived { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
  .row .right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .row input[type=date] { border: 1px solid var(--border); border-radius: 7px; padding: 3px 6px; font-size: 12.5px; background: var(--surface); color: var(--ink-2); }
  .cb { width: 20px; height: 20px; accent-color: var(--s-done); flex: none; }
  .toggle { width: 22px; height: 22px; border: 0; background: transparent; color: var(--muted); border-radius: 6px; flex: none; font-size: 12px; padding: 0; }
  .toggle:hover { background: var(--surface-2); }
  .toggle.blank { visibility: hidden; }

  /* Board */
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .col { background: var(--col); border-radius: 12px; padding: 10px; min-height: 240px; }
  .col.over { outline: 2px dashed var(--primary); outline-offset: -2px; }
  .col-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 13px; padding: 4px 4px 10px; }
  .col-head span { display: inline-flex; gap: 6px; align-items: center; }
  .bcard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: grab; box-shadow: var(--shadow); }
  .bcard.dragging { opacity: .4; }
  .bcard.done .name { color: var(--faint); text-decoration: line-through; }
  .bcard .name { font-weight: 600; margin-bottom: 4px; }
  .bcard .path { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .bcard .foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }

  /* Modal */
  .backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; z-index: 50; overflow-y: auto; }
  .modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 560px; box-shadow: 0 20px 50px rgba(15,23,42,.25); }
  .modal header { padding: 18px 22px 0; display: flex; justify-content: space-between; align-items: center; }
  .modal header h3 { margin: 0; font-size: 18px; }
  .modal .body { padding: 16px 22px; display: flex; flex-direction: column; gap: 14px; }
  .modal footer { padding: 14px 22px 18px; display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
  .field input[type=text], .field input[type=date], .field select, .field textarea { width: 100%; border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
  .field textarea { min-height: 70px; resize: vertical; }
  .field .help { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .checks label { display: inline-flex; gap: 6px; align-items: center; font-weight: 400; margin: 0; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--inverse); color: var(--inverse-ink); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.2); }

  @media (max-width: 960px) {
    .work { grid-template-columns: 1fr; }
    .side { position: static; }
    .grid-2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 16px 16px 48px; }
    h1 { font-size: 24px; }
    .row { flex-wrap: wrap; }
    .row .right { width: 100%; justify-content: flex-start; }
    .two { grid-template-columns: 1fr; }
    .inits { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="error-bar" id="errorBar" role="alert" hidden>
  <span class="msg" data-msg></span>
  <span class="btns"><button class="btn sm" data-retry hidden>Try again</button><button class="btn sm" onclick="hideError()">Dismiss</button></span>
</div>
<div class="wrap" id="app"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
/* =========================================================================
   Project AHA — Finance Transformation tracker
   Data lives in the browser (localStorage). Use "Backup" / "Restore" to move
   it between machines and "Export Excel" for reporting.
   ========================================================================= */

const UI_KEY = 'projectAHA.ui.v1';

// Order matters: lowest progress first. A parent shows the lowest status of its children.
const STATUSES = ['Thoughts', 'Pending User', 'Planning', 'Developing', 'IT Testing', 'User Testing', 'Completed', 'Void'];
const STATUS_KEY = { 'Thoughts': 'thoughts', 'Pending User': 'pending', 'Planning': 'planning', 'Developing': 'dev', 'IT Testing': 'it', 'User Testing': 'ut', 'Completed': 'done', 'Void': 'void' };
const STATUS_META = Object.fromEntries(STATUSES.map(st => { const k = STATUS_KEY[st]; return [st, { color: `var(--s-${k})`, bg: `var(--s-${k}-bg)`, ink: `var(--s-${k}-ink)` }]; }));
const RANK = Object.fromEntries(STATUSES.map((s, i) => [s, i]));
const isClosed = s => s === 'Completed' || s === 'Void';

// Database ids are UUIDs; older browsers without randomUUID get an equivalent v4 id.
const uid = () => crypto.randomUUID ? crypto.randomUUID()
  : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
const isUuid = v => /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ------------------------------------------------------- supabase data */
// All data lives in Supabase (tables: initiatives, work_items, editors).
// Row Level Security there decides who can read and who can change data;
// the page hides edit controls for non-editors to match.
const SUPABASE_URL = 'https://qzspaffquemmqqznasit.supabase.co';
const SUPABASE_KEY = 'sb_publishable_G638JH1qE9C8DVc7Emv8Ow_Opvy5tO9'; // publishable key: safe in the browser
const PAGE_SIZE = 1000;

// Read the auth link details before supabase-js consumes the URL.
const LINK = (() => {
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const q = new URLSearchParams(location.search);
  return {
    type: h.get('type') || q.get('type') || '',
    tokenHash: q.get('token_hash') || '',
    error: h.get('error_description') || q.get('error_description') || '',
    errorCode: h.get('error_code') || q.get('error_code') || '',
  };
})();

let db = { initiatives: [], items: [] }, ui;
const store = {
  sb: null, session: null, isEditor: false, loaded: false, loading: false,
  channel: null, live: 'off', queue: Promise.resolve(),
};
// Auth screen state: 'checking' | 'signin' | 'reset-sent' | 'set-password' | 'app'
const auth = { screen: 'checking', message: '', messageKind: 'error', busy: false, emailHint: '' };
const canEdit = () => store.isEditor;

function loadUI() {
  try { ui = JSON.parse(localStorage.getItem(UI_KEY)) || {}; } catch { ui = {}; }
  ui = Object.assign({ view: 'overview', track: 'all', mode: 'checklist', search: '', status: 'all', hideDone: false, overdueOnly: false, collapsed: [] }, ui);
}
function saveUI() { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch {} }

// Database rows use snake_case; the page uses camelCase.
const fromInit = r => ({ id: r.id, name: r.name, description: r.description || '', order: r.sort_order ?? 0, createdAt: r.created_at });
const toInit = x => ({ id: x.id, name: x.name, description: x.description || '', sort_order: x.order ?? 0 });
const fromItem = r => ({
  id: r.id, initiativeId: r.initiative_id, parentId: r.parent_id || null, name: r.name, status: r.status,
  prevStatus: r.prev_status || undefined, deadline: r.deadline || '', owner: r.owner || '', notes: r.notes || '',
  links: r.links || [], order: r.sort_order ?? 0, createdAt: r.created_at, updatedAt: r.updated_at,
});
const toItem = x => ({
  id: x.id, initiative_id: x.initiativeId, parent_id: x.parentId || null, name: x.name, status: x.status,
  prev_status: x.prevStatus || null, deadline: x.deadline || null, owner: x.owner || '', notes: x.notes || '',
  links: x.links || [], sort_order: x.order ?? 0,
});

// Turn a Supabase / network error into a sentence a person can act on.
function explain(err, doing) {
  const code = err && (err.code || err.status);
  const msg = (err && (err.message || err.error_description)) || '';
  if (!navigator.onLine || /Failed to fetch|NetworkError|Load failed/i.test(msg)) return `Could not ${doing}: no connection to the database. Check your internet connection and try again.`;
  if (code === '42501' || /row-level security/i.test(msg)) return `Could not ${doing}: your account has view-only access. Ask an editor to add your email to the editors list.`;
  if (code === 'PGRST301' || /JWT|expired/i.test(msg)) return `Could not ${doing}: your sign-in has expired. Sign out and sign in again.`;
  if (code === '42P01' || /does not exist|schema cache/i.test(msg)) return `Could not ${doing}: the database tables are missing. Run supabase/setup.sql in the Supabase SQL Editor.`;
  if (code === '23503' && /initiative/i.test(msg)) return `Could not ${doing}: the initiative still has tracks. Delete them first.`;
  if (code === '23503') return `Could not ${doing}: it refers to an item that no longer exists. The page has been refreshed; please try again.`;
  if (code === '23514') return `Could not ${doing}: a value is not allowed (${msg}).`;
  return `Could not ${doing}${msg ? `: ${msg}` : '.'}`;
}

// Error banner sits outside #app so re-renders do not clear it.
function showError(message, retry, kind = 'other') {
  const bar = document.getElementById('errorBar');
  bar.dataset.kind = kind;
  bar.querySelector('[data-msg]').textContent = message;
  const r = bar.querySelector('[data-retry]');
  r.hidden = !retry; r.onclick = () => { hideError(); retry(); };
  bar.hidden = false;
}
function hideError() { document.getElementById('errorBar').hidden = true; }

async function fetchAll(table, order) {
  const rows = [];
  for (let from = 0; ; from += PAGE_SIZE) {
    const { data, error } = await store.sb.from(table).select('*').order(order).order('id').range(from, from + PAGE_SIZE - 1);
    if (error) throw error;
    rows.push(...data);
    if (data.length < PAGE_SIZE) return rows;
  }
}

async function loadData({ quiet = false } = {}) {
  if (!store.session) return;
  store.loading = true;
  if (!quiet) render();
  try {
    const [inits, items, editor] = await Promise.all([
      fetchAll('initiatives', 'sort_order'),
      fetchAll('work_items', 'sort_order'),
      store.sb.rpc('is_editor'),
    ]);
    if (editor.error) throw editor.error;
    db = { initiatives: inits.map(fromInit), items: items.map(fromItem) };
    store.isEditor = editor.data === true;
    store.loaded = true;
    if (document.getElementById('errorBar').dataset.kind === 'load') hideError();
  } catch (err) {
    showError(explain(err, 'load the tracker'), () => loadData(), 'load');
  } finally {
    store.loading = false;
    render();
  }
}

// Apply one realtime change from another browser (or our own echo).
function applyChange(table, payload) {
  const key = table === 'initiatives' ? 'initiatives' : 'items';
  const conv = table === 'initiatives' ? fromInit : fromItem;
  if (payload.eventType === 'DELETE') {
    const id = payload.old && payload.old.id;
    if (!id) return;
    db[key] = db[key].filter(x => x.id !== id);
  } else {
    const row = conv(payload.new);
    const i = db[key].findIndex(x => x.id === row.id);
    if (i >= 0) db[key][i] = row; else db[key].push(row);
  }
  scheduleRender();
}
let renderTimer;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 60); }

function subscribeLive() {
  if (store.channel) store.sb.removeChannel(store.channel);
  let wasDown = false;
  store.channel = store.sb.channel('aha-tracker')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'initiatives' }, p => applyChange('initiatives', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'work_items' }, p => applyChange('work_items', p))
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        store.live = 'on';
        if (wasDown) loadData({ quiet: true }); // catch up on anything missed while disconnected
        wasDown = false;
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        store.live = 'down'; wasDown = true;
      } else if (status === 'CLOSED') {
        store.live = 'off';
      }
      render();
    });
}

// Persist changes. Callers have already applied them to `db` so the page updates instantly.
function commit({ items = [], inits = [], delItems = [], delInits = [] } = {}) {
  if (!canEdit()) { toast('You have view-only access.'); return Promise.resolve(false); }
  const sb = store.sb;
  const depth = it => { let d = 0, p = it; const by = new Map(db.items.map(x => [x.id, x])); while (p && p.parentId && by.has(p.parentId) && d < 64) { d++; p = by.get(p.parentId); } return d; };
  const chunks = (arr, n = 500) => arr.length ? Array.from({ length: Math.ceil(arr.length / n) }, (_, i) => arr.slice(i * n, i * n + n)) : [];
  const ops = [];
  chunks(inits).forEach(c => ops.push(() => sb.from('initiatives').upsert(c.map(toInit))));
  // Parents before children so the parent reference always exists.
  chunks([...items].sort((a, b) => depth(a) - depth(b))).forEach(c => ops.push(() => sb.from('work_items').upsert(c.map(toItem))));
  chunks(delItems).forEach(c => ops.push(() => sb.from('work_items').delete().in('id', c)));
  chunks(delInits).forEach(c => ops.push(() => sb.from('initiatives').delete().in('id', c)));
  // One request at a time keeps quick successive edits in order.
  store.queue = store.queue.then(async () => {
    for (const op of ops) { const { error } = await op(); if (error) throw error; }
    return true;
  }).catch(err => {
    showError(explain(err, 'save your change') + ' Your last change was not saved; the page now shows what is stored.', null);
    loadData({ quiet: true });
    return false;
  });
  return store.queue;
}

/* ---------------------------------------------------------------- auth */
async function initAuth() {
  loadUI();
  if (!window.supabase || !window.supabase.createClient) {
    auth.screen = 'signin';
    auth.message = 'Could not load the sign-in library. Check your internet connection (or any network filter blocking cdn.jsdelivr.net) and reload the page.';
    render(); return;
  }
  store.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

  store.sb.auth.onAuthStateChange((event, session) => {
    store.session = session;
    if (event === 'PASSWORD_RECOVERY') { auth.screen = 'set-password'; render(); return; }
    if (event === 'SIGNED_OUT') { enterSignedOut(); return; }
    // Supabase calls this handler while holding its auth lock: defer further calls.
    if (event === 'SIGNED_IN' && auth.screen === 'signin') setTimeout(enterApp, 0);
  });

  try {
    if (LINK.tokenHash && LINK.type) {
      const { error } = await store.sb.auth.verifyOtp({ token_hash: LINK.tokenHash, type: LINK.type });
      if (error) throw error;
    }
    const { data, error } = await store.sb.auth.getSession();
    if (error) throw error;
    store.session = data.session;
  } catch (err) {
    store.session = null;
    auth.message = linkErrorText(err.message);
  }
  if (LINK.error) auth.message = linkErrorText(LINK.error);

  if (store.session && (LINK.type === 'invite' || LINK.type === 'recovery')) { auth.screen = 'set-password'; render(); }
  else if (store.session) enterApp();
  else { auth.screen = 'signin'; render(); }
}
function linkErrorText(msg) {
  if (/expired|invalid/i.test(msg || '') || LINK.errorCode === 'otp_expired') return 'This link has expired or was already used. Ask an editor for a new invitation, or use “Forgot password?” below.';
  return `That link did not work: ${msg}`;
}
function cleanUrl() { history.replaceState(null, '', location.pathname); }

function enterApp() {
  cleanUrl();
  auth.screen = 'app'; auth.message = '';
  loadData();
  subscribeLive();
}
function enterSignedOut() {
  if (store.channel) { store.sb.removeChannel(store.channel); store.channel = null; }
  store.session = null; store.isEditor = false; store.loaded = false; store.live = 'off';
  db = { initiatives: [], items: [] };
  hideError(); closeModal();
  auth.screen = 'signin';
  render();
}
async function signOut() {
  const { error } = await store.sb.auth.signOut();
  if (error) toast(explain(error, 'sign out'));
  enterSignedOut();
}

function authHTML() {
  const msg = auth.message ? `<div class="auth-msg ${auth.messageKind}" role="alert">${esc(auth.message)}</div>` : '';
  const dis = auth.busy ? 'disabled' : '';
  let body;
  if (auth.screen === 'checking') {
    body = `<p class="auth-sub">Checking your sign-in…</p>`;
  } else if (auth.screen === 'set-password') {
    const email = store.session?.user?.email || '';
    body = `
      <h2>Set your password</h2>
      <p class="auth-sub">${LINK.type === 'invite' ? 'Welcome to the Project AHA tracker. Choose a password to finish setting up your account' : 'Choose a new password'}${email ? ` for <b>${esc(email)}</b>` : ''}.</p>
      ${msg}
      <form id="authForm" data-form="set-password" novalidate>
        <div class="field"><label for="newPassword">New password</label><input type="password" id="newPassword" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label for="confirmPassword">Confirm password</label><input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>
          <div class="help">At least 8 characters.</div></div>
        <button class="btn primary block" type="submit" ${dis}>${auth.busy ? 'Saving…' : 'Save password and continue'}</button>
      </form>`;
  } else if (auth.screen === 'reset-sent') {
    body = `
      <h2>Check your email</h2>
      <p class="auth-sub">If <b>${esc(auth.emailHint)}</b> has an account, a password reset link is on its way. Open it on this device to choose a new password.</p>
      <button class="btn block" data-auth="back">Back to sign in</button>`;
  } else {
    body = `
      <h2>Sign in</h2>
      <p class="auth-sub">Project AHA finance transformation tracker. Access is by invitation.</p>
      ${msg}
      <form id="authForm" data-form="signin" novalidate>
        <div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="username" value="${esc(auth.emailHint)}" required></div>
        <div class="field"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required></div>
        <button class="btn primary block" type="submit" ${dis}>${auth.busy ? 'Signing in…' : 'Sign in'}</button>
      </form>
      <button class="btn ghost block" data-auth="forgot" ${dis}>Forgot password?</button>`;
  }
  return `<div class="auth-wrap"><div class="card auth-card"><div class="auth-brand">Project AHA</div>${body}</div></div>`;
}

async function handleAuthSubmit(form) {
  const kind = form.dataset.form;
  const say = (m, k = 'error') => { auth.message = m; auth.messageKind = k; auth.busy = false; render(); };
  if (kind === 'signin') {
    const email = form.querySelector('#email').value.trim(), password = form.querySelector('#password').value;
    auth.emailHint = email;
    if (!email || !password) return say('Enter your email and password.');
    auth.busy = true; auth.message = ''; render();
    const { error } = await store.sb.auth.signInWithPassword({ email, password });
    if (error) {
      const m = /invalid login/i.test(error.message) ? 'Email or password is incorrect.'
        : /not confirmed/i.test(error.message) ? 'This email has not been confirmed yet. Open the invitation email first.'
        : explain(error, 'sign in');
      return say(m);
    }
    auth.busy = false; // onAuthStateChange moves on to the dashboard
  } else if (kind === 'set-password') {
    const p1 = form.querySelector('#newPassword').value, p2 = form.querySelector('#confirmPassword').value;
    if (p1.length < 8) return say('Use at least 8 characters.');
    if (p1 !== p2) return say('The two passwords do not match.');
    auth.busy = true; auth.message = ''; render();
    const { error } = await store.sb.auth.updateUser({ password: p1 });
    if (error) return say(/same/i.test(error.message) ? 'Choose a password different from your current one.' : explain(error, 'save your password'));
    auth.busy = false;
    toast('Password saved.');
    enterApp();
  }
}
async function forgotPassword() {
  const email = (document.getElementById('email')?.value || '').trim();
  auth.emailHint = email;
  if (!email) { auth.message = 'Enter your email above, then choose “Forgot password?”.'; auth.messageKind = 'error'; render(); return; }
  auth.busy = true; render();
  const { error } = await store.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  auth.busy = false;
  if (error) { auth.message = explain(error, 'send the reset email'); auth.messageKind = 'error'; render(); return; }
  auth.screen = 'reset-sent'; auth.message = ''; render();
}

/* --------------------------------------------------------- derivations */
// Rebuilt on every render so that parents always reflect their children.
let IDX;
function index() {
  const byId = new Map(db.items.map(i => [i.id, i]));
  const kids = new Map();
  for (const i of db.items) {
    const key = i.parentId && byId.has(i.parentId) ? i.parentId : 'root:' + i.initiativeId;
    if (!kids.has(key)) kids.set(key, []);
    kids.get(key).push(i);
  }
  for (const list of kids.values()) list.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  IDX = { byId, kids, status: new Map(), code: new Map(), deadline: new Map(), initById: new Map(db.initiatives.map(x => [x.id, x])) };
}
const childrenOf = id => IDX.kids.get(id) || [];
const tracksOf = initId => IDX.kids.get('root:' + initId) || [];
const hasKids = item => childrenOf(item.id).length > 0;
const initiatives = () => [...db.initiatives].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

// Effective status: a leaf uses its own status; a parent takes the lowest
// status among its non-Void children. If every child is Void, it is Void.
function effStatus(item) {
  if (IDX.status.has(item.id)) return IDX.status.get(item.id);
  const kids = childrenOf(item.id);
  let s = item.status;
  if (kids.length) {
    const live = kids.map(effStatus).filter(x => x !== 'Void');
    s = live.length ? live.reduce((a, b) => (RANK[a] <= RANK[b] ? a : b)) : 'Void';
  }
  IDX.status.set(item.id, s);
  return s;
}

const letters = n => { let s = ''; n += 1; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(97 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
// Numbering follows position: 1, 1a, 1a.1, 1a.1.1 ...
function codeOf(item) {
  if (IDX.code.has(item.id)) return IDX.code.get(item.id);
  const parent = item.parentId && IDX.byId.get(item.parentId);
  const siblings = parent ? childrenOf(parent.id) : tracksOf(item.initiativeId);
  const pos = siblings.indexOf(item);
  let c;
  if (!parent) c = String(pos + 1);
  else if (!parent.parentId) c = codeOf(parent) + letters(pos);
  else c = codeOf(parent) + '.' + (pos + 1);
  IDX.code.set(item.id, c);
  return c;
}
const depthOf = item => { let d = 0, p = item; while (p.parentId && IDX.byId.get(p.parentId)) { d++; p = IDX.byId.get(p.parentId); } return d; };
const trackOf = item => { let p = item; while (p.parentId && IDX.byId.get(p.parentId)) p = IDX.byId.get(p.parentId); return p; };
const ancestors = item => { const out = []; let p = item; while (p.parentId && IDX.byId.get(p.parentId)) { p = IDX.byId.get(p.parentId); out.unshift(p); } return out; };
function descendants(item) { const out = []; const walk = i => childrenOf(i.id).forEach(c => { out.push(c); walk(c); }); walk(item); return out; }
function leavesUnder(item) { return hasKids(item) ? descendants(item).filter(d => !hasKids(d)) : [item]; }
const leavesOfInit = initId => tracksOf(initId).flatMap(leavesUnder);
const allLeaves = () => initiatives().flatMap(i => leavesOfInit(i.id));

// Parents without their own deadline inherit the earliest open deadline below them.
function effDeadline(item) {
  if (IDX.deadline.has(item.id)) return IDX.deadline.get(item.id);
  let d = { date: item.deadline || '', inherited: false };
  if (!d.date && hasKids(item)) {
    const ds = descendants(item).filter(x => x.deadline && !isClosed(effStatus(x))).map(x => x.deadline).sort();
    if (ds.length) d = { date: ds[0], inherited: true };
  }
  IDX.deadline.set(item.id, d);
  return d;
}

function todayISO() { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function daysUntil(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split('-').map(Number);
  return Math.round((new Date(y, m - 1, d) - todayISO()) / 86400000);
}
function dueInfo(item) {
  const s = effStatus(item); const { date, inherited } = effDeadline(item);
  if (!date) return null;
  const n = daysUntil(date);
  const pre = inherited ? 'Next: ' : '';
  if (isClosed(s)) return { cls: 'done', text: s === 'Void' ? 'Void' : 'Done', n };
  if (n < 0) return { cls: 'over', text: `${pre}Overdue by ${-n} day${n === -1 ? '' : 's'}`, n };
  if (n === 0) return { cls: 'soon', text: `${pre}Due today`, n };
  return { cls: n <= 7 ? 'soon' : 'later', text: `${pre}${n} day${n === 1 ? '' : 's'} left`, n };
}
const fmtDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); };

function stats(leaves) {
  const counts = Object.fromEntries(STATUSES.map(s => [s, 0]));
  leaves.forEach(l => counts[effStatus(l)]++);
  const live = leaves.length - counts['Void'];
  const done = counts['Completed'];
  return { counts, total: leaves.length, live, done, pct: live ? Math.round(done / live * 100) : 0 };
}
function lowestStatus(items) {
  const live = items.map(effStatus).filter(s => s !== 'Void');
  return live.length ? live.reduce((a, b) => (RANK[a] <= RANK[b] ? a : b)) : (items.length ? 'Void' : null);
}
const pathText = item => { const init = IDX.initById.get(item.initiativeId); return [init ? init.name : '', ...ancestors(item).map(a => `${codeOf(a)} ${a.name}`)].filter(Boolean).join(' › '); };

/* ------------------------------------------------------------ mutations */
function touch(item) { item.updatedAt = new Date().toISOString(); }
function setStatus(id, status) {
  const item = IDX.byId.get(id); if (!item) return;
  if (status === 'Completed' && item.status !== 'Completed') item.prevStatus = item.status;
  item.status = status; touch(item); commit({ items: [item] }); render();
}
function setDeadline(id, date) { const item = IDX.byId.get(id); if (!item) return; item.deadline = date; touch(item); commit({ items: [item] }); render(); }
function toggleDone(id, checked) {
  const item = IDX.byId.get(id); if (!item) return;
  if (checked) setStatus(id, 'Completed');
  else setStatus(id, item.prevStatus && item.prevStatus !== 'Completed' ? item.prevStatus : 'User Testing');
}
function deleteItem(id) {
  const item = IDX.byId.get(id); if (!item) return;
  const gone = new Set([id, ...descendants(item).map(d => d.id)]);
  db.items = db.items.filter(i => !gone.has(i.id));
  if (ui.track && gone.has(ui.track)) ui.track = 'all';
  commit({ delItems: [...gone] }); render();
}
function moveItem(id, dir) {
  const item = IDX.byId.get(id); if (!item) return;
  const sibs = item.parentId ? childrenOf(item.parentId) : tracksOf(item.initiativeId);
  const i = sibs.indexOf(item), j = i + dir;
  if (j < 0 || j >= sibs.length) return;
  [sibs[i], sibs[j]] = [sibs[j], sibs[i]];
  sibs.forEach((s, k) => s.order = k);
  commit({ items: sibs }); render();
}
function unlinkItem(id, initId) {
  const item = IDX.byId.get(id); if (!item) return;
  item.links = (item.links || []).filter(l => l !== initId);
  touch(item); commit({ items: [item] }); render();
  toast(`Unlinked ${codeOf(item)} ${item.name}.`);
}
function nextOrder(initId, parentId) { const sibs = parentId ? childrenOf(parentId) : tracksOf(initId); return sibs.length ? Math.max(...sibs.map(s => s.order ?? 0)) + 1 : 0; }

/* -------------------------------------------------------------- render */
const statusPill = s => { const m = STATUS_META[s] || STATUS_META.Thoughts; return `<span class="pill" style="background:${m.bg};color:${m.ink}"><span class="dot" style="background:${m.color}"></span>${esc(s)}</span>`; };
function statusSelect(item) {
  const s = effStatus(item), m = STATUS_META[s];
  const derived = hasKids(item);
  return `<select class="status" data-act="status" data-id="${item.id}" style="background:${m.bg};color:${m.ink}" ${derived ? 'disabled title="Rolled up from sub-items — change a sub-item to update"' : !canEdit() ? 'disabled title="View only"' : ''}>
    ${STATUSES.map(x => `<option ${x === s ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
}
const dueChip = item => { const d = dueInfo(item); return d ? `<span class="due ${d.cls}" title="Deadline ${esc(fmtDate(effDeadline(item).date))}">${esc(d.text)}</span>` : ''; };

function render() {
  const appEl = document.getElementById('app');
  if (auth.screen !== 'app') {
    const had = document.activeElement && appEl.contains(document.activeElement) ? document.activeElement.id : '';
    // Keep what the person typed when the form re-renders with a message.
    const typed = Object.fromEntries([...appEl.querySelectorAll('input[id]')].map(i => [i.id, i.value]));
    appEl.innerHTML = authHTML();
    Object.entries(typed).forEach(([id, v]) => { const i = document.getElementById(id); if (i && v) i.value = v; });
    const f = (had && document.getElementById(had)) || [...appEl.querySelectorAll('input')].find(i => !i.value);
    if (f) f.focus();
    return;
  }
  index();
  if (ui.view !== 'overview' && !IDX.initById.has(ui.view)) { ui.view = 'overview'; ui.track = 'all'; }
  const app = document.getElementById('app');
  const inits = initiatives();
  const cur = ui.view === 'overview' ? null : IDX.initById.get(ui.view);
  const title = cur ? `What’s next for ${esc(cur.name)}?` : 'Project AHA — Finance Transformation';
  const subtitle = cur ? (esc(cur.description) || 'Track the work. Clear testing. Move confidently to release.') : 'Overall progress across all initiatives. Select an initiative to drill into its tracks.';

  app.innerHTML = `
    <div class="top">
      <div><h1>${title}</h1><div class="sub">${subtitle}</div>
        <div class="userbar">
          <span class="who">${esc(store.session?.user?.email || '')}</span>
          ${store.loaded ? (canEdit() ? '<span class="role edit">Editor</span>' : '<span class="role view" title="Ask an editor to add your email to the editors list to make changes">View only</span>') : ''}
          <span class="mode-note" style="margin:0">${store.live === 'on' ? '<span class="dot" style="background:var(--s-done)"></span>Live' : store.live === 'down' ? '<span class="dot" style="background:var(--s-pending)"></span>Live updates paused, reconnecting…' : '<span class="dot" style="background:var(--faint)"></span>Connecting…'}</span>
          <button class="btn sm ghost" data-act="sign-out">Sign out</button>
        </div></div>
      <div class="actions">
        <button class="btn" data-act="export-xlsx">Export Excel</button>
        <button class="btn" data-act="backup">Backup</button>
        ${canEdit() ? `<button class="btn" data-act="restore">Restore</button>
        ${cur ? `<button class="btn" data-act="edit-init" data-id="${cur.id}" title="Rename, reorder or delete this initiative">Edit initiative</button>
                 <button class="btn primary" data-act="add-item" data-init="${cur.id}">+ Add track</button>`
              : `<button class="btn primary" data-act="add-init">+ Add initiative</button>`}` : ''}
      </div>
    </div>
    <nav class="tabs">
      <button class="tab ${!cur ? 'active' : ''}" data-act="view" data-view="overview">Project AHA overview</button>
      ${inits.map(i => `<button class="tab ${cur && cur.id === i.id ? 'active' : ''}" data-act="view" data-view="${i.id}">${esc(i.name)}<span class="n">${leavesOfInit(i.id).length}</span></button>`).join('')}
      ${canEdit() ? '<button class="tab add" data-act="add-init">+ New initiative</button>' : ''}
    </nav>
    ${!store.loaded ? `<div class="card empty" style="padding:48px">${store.loading ? 'Loading Project AHA…' : 'The tracker could not be loaded. See the message above.'}</div>` : `
    ${!inits.length ? `<div class="banner info">${canEdit() ? 'No initiatives yet. Use “+ Add initiative” to create the first one (for example ORION), then add its tracks and items.' : 'No initiatives yet. An editor needs to add them.'}</div>` : ''}
    ${cur ? renderInitiativeHeader(cur) : renderOverview(inits)}
    ${renderWork(cur)}`}
  `;
}

function kpiCards(leaves, heroLabel) {
  const st = stats(leaves);
  const open = leaves.filter(l => !isClosed(effStatus(l)));
  const overdue = open.filter(l => { const n = daysUntil(l.deadline); return n !== null && n < 0; }).length;
  const soon = open.filter(l => { const n = daysUntil(l.deadline); return n !== null && n >= 0 && n <= 7; }).length;
  const groups = [
    ['Early stage', ['Thoughts', 'Pending User', 'Planning'], 'Thoughts · Pending user · Planning', 'var(--s-thoughts)'],
    ['Developing', ['Developing'], 'Build & clarify', STATUS_META.Developing.color],
    ['Testing', ['IT Testing', 'User Testing'], `IT ${st.counts['IT Testing']} · User ${st.counts['User Testing']}`, STATUS_META['IT Testing'].color],
    ['Completed', ['Completed'], st.counts.Void ? `${st.counts.Void} void (excluded)` : 'Released', STATUS_META.Completed.color],
  ];
  return `<div class="kpis">
    <div class="card kpi hero"><div class="lbl">${esc(heroLabel)}</div><div class="val">${st.pct}%</div><div class="hint">${st.done} of ${st.live} work items completed</div></div>
    ${groups.map(([lbl, ss, hint, color]) => `<div class="card kpi"><div class="lbl"><span class="dot" style="background:${color}"></span>${lbl}</div><div class="val">${ss.reduce((a, s) => a + st.counts[s], 0)}</div><div class="hint">${hint}</div></div>`).join('')}
    <div class="card kpi"><div class="lbl">Deadlines</div><div class="val ${overdue ? 'bad' : ''}">${overdue}</div><div class="hint">overdue · ${soon} due within 7 days</div></div>
  </div>`;
}

function distribution(leaves) {
  const st = stats(leaves);
  const segs = STATUSES.filter(s => st.counts[s]);
  return `<div class="card dist">
    <div class="prog-row"><span>Status of all ${st.total} work items</span></div>
    <div class="stackbar" role="img" aria-label="Status distribution">
      ${segs.map(s => `<div style="flex:${st.counts[s]};background:${STATUS_META[s].color}" title="${s}: ${st.counts[s]} (${Math.round(st.counts[s] / st.total * 100)}%)"></div>`).join('')}
    </div>
    <div class="legend">${STATUSES.map(s => `<span><span class="dot" style="background:${STATUS_META[s].color}"></span>${s} <b>${st.counts[s]}</b></span>`).join('')}</div>
  </div>`;
}

function renderOverview(inits) {
  const leaves = allLeaves();
  const open = leaves.filter(l => !isClosed(effStatus(l)) && l.deadline);
  const upcoming = open.map(l => ({ l, n: daysUntil(l.deadline) })).filter(x => x.n <= 14).sort((a, b) => a.n - b.n).slice(0, 12);
  return `
    ${kpiCards(leaves, 'Project AHA progress')}
    <div class="section-title"><h2>Initiatives</h2><span class="meta">${inits.length} initiative${inits.length === 1 ? '' : 's'} · status shown is the lowest across each track</span></div>
    <div class="inits">
      ${inits.map(i => {
        const tr = tracksOf(i.id); const st = stats(leavesOfInit(i.id)); const low = lowestStatus(tr);
        return `<div class="card init">
          <div class="init-head">
            <div><h3>${esc(i.name)}</h3><div class="desc">${esc(i.description || '')}</div></div>
            ${low ? statusPill(low) : ''}
          </div>
          <div><div class="prog-row"><span>${st.done} of ${st.live} completed</span><b>${st.pct}%</b></div><div class="bar"><div style="width:${st.pct}%"></div></div></div>
          <div class="tracklist">
            ${tr.map(t => { const ls = stats(leavesUnder(t)); return `<div class="trackrow"><span class="t"><span class="code">${codeOf(t)}</span>${esc(t.name)}</span><span class="c">${ls.done}/${ls.live}</span>${statusPill(effStatus(t))}</div>`; }).join('') || '<div class="empty">No tracks yet</div>'}
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            ${canEdit() ? `<button class="btn sm ghost" data-act="edit-init" data-id="${i.id}" title="Rename, reorder or delete">Edit</button>` : ''}
            <button class="btn sm" data-act="view" data-view="${i.id}">Open ${esc(i.name)} →</button>
          </div>
        </div>`;
      }).join('')}
      ${canEdit() ? '<button class="card init add" data-act="add-init">+ Add new initiative</button>' : ''}
    </div>
    <div class="section-title"><h2>Status mix & deadlines</h2><span class="meta">Today: ${fmtDate(stamp())}</span></div>
    <div class="grid-2">
      ${distribution(leaves)}
      <div class="card dl">
        <div style="padding:6px 18px 8px;font-weight:600">Overdue & due in next 14 days</div>
        ${upcoming.length ? upcoming.map(({ l }) => `<div class="dl-item" ${canEdit() ? `data-act="edit-item" data-id="${l.id}"` : 'style="cursor:default"'}><div><div class="nm">${esc(l.name)}</div><div class="path">${esc(pathText(l))}</div></div>${dueChip(l)}</div>`).join('')
          : '<div class="empty">No open items due in the next 14 days. Set deadlines from the checklist or the Edit dialog.</div>'}
      </div>
    </div>
    <div class="section-title"><h2>All work</h2><span class="meta">Every initiative in one list</span></div>`;
}

function renderInitiativeHeader(init) {
  const linked = db.items.filter(i => (i.links || []).includes(init.id) && i.initiativeId !== init.id);
  return `${kpiCards(leavesOfInit(init.id), init.name + ' progress')}
    ${linked.length ? `<div class="banner info">${linked.length} item${linked.length > 1 ? 's' : ''} from other initiatives ${linked.length > 1 ? 'are' : 'is'} linked here (shown at the bottom of the checklist; not counted in this initiative’s progress).</div>` : ''}
    <div style="height:20px"></div>`;
}

/* Work panel: sidebar + checklist/board, scoped to one initiative or all. */
function renderWork(cur) {
  const sideEntries = cur
    ? tracksOf(cur.id).map(t => ({ id: t.id, label: `${codeOf(t)}. ${t.name}`, count: leavesUnder(t).length, status: effStatus(t) }))
    : initiatives().map(i => ({ id: i.id, label: i.name, count: leavesOfInit(i.id).length, status: lowestStatus(tracksOf(i.id)) }));
  if (ui.track !== 'all' && !sideEntries.some(e => e.id === ui.track)) ui.track = 'all';
  const scopeLeaves = cur ? leavesOfInit(cur.id) : allLeaves();
  const st = stats(scopeLeaves);
  const sel = sideEntries.find(e => e.id === ui.track);

  return `<div class="work">
    <aside class="card side">
      <h4>${cur ? 'TRACKS' : 'INITIATIVES'}</h4>
      <button class="side-item ${ui.track === 'all' ? 'active' : ''}" data-act="track" data-id="all"><span class="lbl">All ${cur ? 'tracks' : 'initiatives'}</span><span class="n">${scopeLeaves.length}</span></button>
      ${sideEntries.map(e => `<button class="side-item ${ui.track === e.id ? 'active' : ''}" data-act="track" data-id="${e.id}" title="${esc(e.label)} — ${esc(e.status || '')}">
        <span class="dot" style="background:${e.status ? STATUS_META[e.status].color : 'var(--border-strong)'}"></span><span class="lbl">${esc(e.label)}</span><span class="n">${e.count}</span></button>`).join('')}
      ${cur && canEdit() ? `<button class="side-item" style="color:var(--primary)" data-act="add-item" data-init="${cur.id}">+ Add track</button>` : ''}
      <div class="foot">
        <div style="font-weight:700;letter-spacing:.1em;font-size:11px">COMPLETION</div>
        <div class="big">${st.pct}%</div>
        <div class="bar"><div style="width:${st.pct}%"></div></div>
        <p style="margin:10px 0 0">A track or parent item shows the <b>lowest</b> status of its sub-items. Void items are excluded. Ticking a box marks the item Completed.</p>
      </div>
    </aside>
    <section>
      <div class="toolbar">
        <input type="search" placeholder="Search items, notes or owners…" value="${esc(ui.search)}" data-act="search">
        <select data-act="filter-status"><option value="all">All statuses</option>${STATUSES.map(s => `<option ${ui.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
        <label class="chk"><input type="checkbox" data-act="hide-done" ${ui.hideDone ? 'checked' : ''}> Hide completed / void</label>
        <label class="chk"><input type="checkbox" data-act="overdue-only" ${ui.overdueOnly ? 'checked' : ''}> Overdue only</label>
        <div class="seg"><button class="${ui.mode === 'checklist' ? 'on' : ''}" data-act="mode" data-mode="checklist">Checklist</button><button class="${ui.mode === 'board' ? 'on' : ''}" data-act="mode" data-mode="board">Board</button></div>
      </div>
      <div class="work-head"><h3>${sel ? esc(sel.label) : (cur ? 'All tracks' : 'All initiatives')}</h3><span class="meta" id="countMeta"></span></div>
      ${ui.mode === 'board' ? renderBoard(cur) : renderChecklist(cur)}
    </section>
  </div>`;
}

function matches(item) {
  const s = effStatus(item);
  if (ui.status !== 'all' && s !== ui.status) return false;
  if (ui.hideDone && isClosed(s)) return false;
  if (ui.overdueOnly) { const d = dueInfo(item); if (!d || d.cls !== 'over') return false; }
  if (ui.search) {
    const q = ui.search.toLowerCase();
    const hay = [item.name, item.notes, item.owner, codeOf(item), ...ancestors(item).map(a => a.name)].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
// A node shows if it matches or any descendant matches.
function visible(item, memo) {
  if (memo.has(item.id)) return memo.get(item.id);
  const v = matches(item) || childrenOf(item.id).some(c => visible(c, memo));
  memo.set(item.id, v); return v;
}
const filtersActive = () => ui.search || ui.status !== 'all' || ui.hideDone || ui.overdueOnly;

function rootsInScope(cur) {
  if (cur) return tracksOf(cur.id).filter(t => ui.track === 'all' || t.id === ui.track);
  return initiatives().filter(i => ui.track === 'all' || i.id === ui.track).flatMap(i => tracksOf(i.id));
}

function rowHTML(item, depth, opts = {}) {
  const s = effStatus(item), closed = isClosed(s), kids = hasKids(item);
  const collapsed = ui.collapsed.includes(item.id);
  const leafCount = kids ? leavesUnder(item) : null;
  const ls = kids ? stats(leafCount) : null;
  const linkTags = (item.links || []).map(l => IDX.initById.get(l)).filter(Boolean).filter(l => l.id !== item.initiativeId)
    .map(l => `<span class="tag link" title="Linked initiative">↔ ${esc(l.name)}</span>`).join('');
  const fromTag = opts.linkedFrom ? `<span class="tag">From ${esc(opts.linkedFrom)}</span>` : '';
  return `<div class="row ${depth === 0 ? 'track' : ''} ${closed ? 'done' : ''}" style="margin-left:${depth * 28}px">
    <button class="toggle ${kids ? '' : 'blank'}" data-act="collapse" data-id="${item.id}" aria-label="${collapsed ? 'Expand' : 'Collapse'}">${collapsed ? '▶' : '▼'}</button>
    <input type="checkbox" class="cb" data-act="done" data-id="${item.id}" ${s === 'Completed' ? 'checked' : ''} ${kids ? 'disabled title="Completes automatically when all sub-items are completed"' : !canEdit() ? 'disabled' : ''}>
    <div class="main">
      <div class="name"><span class="code">${opts.linkedFrom ? '' : (depth === 0 ? 'Track ' : '')}${codeOf(item)}</span>${esc(item.name)}</div>
      <div class="meta-line">
        ${opts.path ? `<span>${esc(opts.path)}</span>` : ''}
        ${fromTag}
        ${kids ? `<span class="tag derived" title="Status rolled up from sub-items">${ls.done}/${ls.live} sub-items done · rolled up</span>` : ''}
        ${item.owner ? `<span>👤 ${esc(item.owner)}</span>` : ''}
        ${linkTags}
        ${item.notes ? `<span title="${esc(item.notes)}">📝 ${esc(item.notes.length > 60 ? item.notes.slice(0, 60) + '…' : item.notes)}</span>` : ''}
      </div>
    </div>
    <div class="right">
      ${dueChip(item)}
      <input type="date" value="${esc(item.deadline || '')}" data-act="deadline" data-id="${item.id}" title="Deadline" aria-label="Deadline" ${canEdit() ? '' : 'disabled'}>
      ${statusSelect(item)}
      ${canEdit() && opts.unlinkFrom ? `<button class="btn sm ghost" data-act="unlink" data-id="${item.id}" data-init="${opts.unlinkFrom}" title="Stop showing this item here">Unlink</button>` : ''}
      ${canEdit() ? `<button class="btn sm ghost" data-act="add-item" data-init="${item.initiativeId}" data-parent="${item.id}" title="Add sub-item under ${esc(codeOf(item))}">+ Sub</button>
      <button class="btn sm" data-act="edit-item" data-id="${item.id}">Edit</button>` : ''}
    </div>
  </div>`;
}

// Items from other initiatives linked into `cur`. If an item and one of its
// ancestors are both linked, only the ancestor is listed (its subtree covers it).
function linkedRoots(cur) {
  const linkedHere = i => (i.links || []).includes(cur.id) && i.initiativeId !== cur.id;
  return db.items.filter(i => linkedHere(i) && !ancestors(i).some(linkedHere))
    .sort((a, b) => (a.initiativeId + codeOf(a)).localeCompare(b.initiativeId + codeOf(b), undefined, { numeric: true }));
}
// The linked item (itself or an ancestor) that brings `item` into initiative `initId`, if any.
function linkSource(item, initId) {
  if (item.initiativeId === initId) return null;
  return [item, ...ancestors(item).reverse()].find(x => (x.links || []).includes(initId)) || null;
}

function renderChecklist(cur) {
  const memo = new Map();
  let shown = 0;
  const walk = (item, depth, opts) => {
    if (!visible(item, memo)) return '';
    shown++;
    let html = rowHTML(item, depth, opts);
    if (!ui.collapsed.includes(item.id) || filtersActive()) html += childrenOf(item.id).map(c => walk(c, depth + 1)).join('');
    return html;
  };
  let html = '';
  if (cur) {
    html = rootsInScope(cur).map(t => `<div class="group">${walk(t, 0)}</div>`).join('');
    if (ui.track === 'all') {
      const linked = linkedRoots(cur).filter(i => visible(i, memo));
      if (linked.length) html += `<div class="init-label">Linked from other initiatives</div>` + linked.map(l =>
        `<div class="group">${walk(l, 0, { linkedFrom: IDX.initById.get(l.initiativeId)?.name || 'another initiative', path: pathText(l), unlinkFrom: cur.id })}</div>`).join('');
    }
  } else {
    html = initiatives().filter(i => ui.track === 'all' || i.id === ui.track).map(i => {
      const body = tracksOf(i.id).map(t => walk(t, 0)).join('');
      return body ? `<div class="init-label">${esc(i.name)}</div>${body}` : '';
    }).join('');
  }
  queueMicrotask(() => { const m = document.getElementById('countMeta'); if (m) m.textContent = `${shown} row${shown === 1 ? '' : 's'}`; });
  return html || `<div class="card empty">${filtersActive() ? 'No items match the filters.' : 'No tracks yet. Use “+ Add track” to create one.'}</div>`;
}

function renderBoard(cur) {
  // Every work item gets a card, including items that have sub-items (shown with their
  // rolled-up status). Tracks that have sub-items are left out: the sidebar and
  // checklist already show them, and their sub-items are on the board.
  const onBoard = i => !(hasKids(i) && !i.parentId);
  const withSubtree = i => [i, ...descendants(i)];
  let cards = rootsInScope(cur).flatMap(withSubtree).filter(onBoard);
  if (cur && ui.track === 'all') {
    const seen = new Set(cards);
    // A linked item always gets its own card, even a track, so it can be unlinked here.
    linkedRoots(cur).forEach(l => withSubtree(l).forEach(x => { if (!seen.has(x) && (x === l || onBoard(x))) { seen.add(x); cards.push(x); } }));
  }
  cards = cards.filter(matches);
  const cols = STATUSES.filter(s => !(ui.hideDone && isClosed(s)) && (ui.status === 'all' || ui.status === s));
  queueMicrotask(() => { const m = document.getElementById('countMeta'); if (m) m.textContent = `${cards.length} card${cards.length === 1 ? '' : 's'}${canEdit() ? ' · drag cards to change status' : ''}`; });
  return `<div class="board">${cols.map(s => {
    const items = cards.filter(l => effStatus(l) === s);
    return `<div class="col" data-drop="${s}">
      <div class="col-head"><span><span class="dot" style="background:${STATUS_META[s].color}"></span>${s}</span><span style="color:var(--muted)">${items.length}</span></div>
      ${items.map(l => cardHTML(l, s, cur)).join('')}
    </div>`;
  }).join('')}</div>`;
}

function cardHTML(l, s, cur) {
  const kids = hasKids(l);
  const ls = kids ? stats(leavesUnder(l)) : null;
  const src = cur ? linkSource(l, cur.id) : null;
  const draggable = canEdit() && !kids; // a parent's status comes from its sub-items
  const linkTags = (l.links || []).filter(x => x !== l.initiativeId).map(x => IDX.initById.get(x)).filter(Boolean).map(x => ` <span class="tag link">↔ ${esc(x.name)}</span>`).join('');
  const linkedTag = src ? (src === l ? ' <span class="tag">linked</span>' : ` <span class="tag" title="Shown here because ${esc(codeOf(src))} is linked">via ${esc(codeOf(src))}</span>`) : '';
  return `<div class="bcard ${isClosed(s) ? 'done' : ''}" ${draggable ? `draggable="true" data-drag="${l.id}"` : 'style="cursor:default"'}>
    <div style="display:flex;gap:8px;justify-content:space-between;align-items:flex-start">
      <div class="name"><span class="code">${codeOf(l)}</span>${esc(l.name)}</div>
      <input type="checkbox" class="cb" data-act="done" data-id="${l.id}" ${s === 'Completed' ? 'checked' : ''} ${kids ? 'disabled title="Completes automatically when all sub-items are completed"' : canEdit() ? '' : 'disabled'}>
    </div>
    <div class="path">${esc(pathText(l))}${linkedTag}${linkTags}${kids ? ` <span class="tag derived" title="Status rolled up from sub-items">${ls.done}/${ls.live} sub-items done</span>` : ''}</div>
    <div class="foot">${statusSelect(l)}${dueChip(l)}${canEdit() ? `${src === l ? `<button class="btn sm ghost" data-act="unlink" data-id="${l.id}" data-init="${cur.id}" title="Stop showing this item in ${esc(cur.name)}">Unlink</button>` : ''}<button class="btn sm" data-act="edit-item" data-id="${l.id}">Edit</button>` : ''}</div>
  </div>`;
}

/* --------------------------------------------------------------- modals */
function openModal(html, onMount) {
  closeModal();
  const bd = document.createElement('div');
  bd.className = 'backdrop'; bd.id = 'modal';
  bd.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  bd.addEventListener('mousedown', e => { if (e.target === bd) closeModal(); });
  document.body.appendChild(bd);
  onMount && onMount(bd);
  const f = bd.querySelector('input[type=text]'); f && f.focus();
}
function closeModal() { document.getElementById('modal')?.remove(); }
function confirmDialog(message, okLabel, onOk, onCancel) {
  openModal(`
    <header><h3>Please confirm</h3></header>
    <div class="body"><p class="confirm-text">${esc(message)}</p></div>
    <footer><span></span><div style="display:flex;gap:8px"><button class="btn" data-no>Cancel</button><button class="btn primary" data-yes>${esc(okLabel)}</button></div></footer>`, bd => {
    bd.querySelector('[data-no]').onclick = () => { closeModal(); onCancel && onCancel(); };
    bd.querySelector('[data-yes]').onclick = () => { closeModal(); onOk(); };
    bd.querySelector('[data-yes]').focus();
  });
}

function itemModal({ id, initiativeId, parentId }) {
  const item = id ? IDX.byId.get(id) : null;
  const initId = item ? item.initiativeId : initiativeId;
  const init = IDX.initById.get(initId);
  const pId = item ? item.parentId : (parentId || null);
  const kids = item && hasKids(item);
  const banned = new Set(item ? [item.id, ...descendants(item).map(d => d.id)] : []);
  const parentOptions = [];
  const walk = (list, depth) => list.forEach(i => { if (!banned.has(i.id)) { parentOptions.push(`<option value="${i.id}" ${i.id === pId ? 'selected' : ''}>${'  '.repeat(depth)}${esc(codeOf(i))} ${esc(i.name)}</option>`); walk(childrenOf(i.id), depth + 1); } });
  walk(tracksOf(initId), 0);
  const parent = pId && IDX.byId.get(pId);
  const heading = item ? `Edit ${depthOf(item) === 0 ? 'track' : 'item'} ${codeOf(item)}` : (parent ? `Add sub-item under ${codeOf(parent)}` : `Add track to ${esc(init?.name || '')}`);
  const status = item ? item.status : (parent ? 'Thoughts' : 'Thoughts');
  const others = initiatives().filter(i => i.id !== initId);

  openModal(`
    <header><h3>${heading}</h3><button class="btn ghost sm" data-close>✕</button></header>
    <div class="body">
      <div class="field"><label>Name</label><input type="text" name="name" value="${esc(item?.name || '')}" placeholder="${parent ? 'e.g. Debtor Report' : 'e.g. Debt Management'}"></div>
      <div class="field"><label>Parent</label>
        <select name="parentId"><option value="">— Top-level track in ${esc(init?.name || '')} —</option>${parentOptions.join('')}</select>
        <div class="help">Nest as deep as you need (Track 1 → 1a → 1a.1 → 1a.1.1 …). Numbering updates automatically.</div>
      </div>
      <div class="two">
        <div class="field"><label>Status</label>
          <select name="status" ${kids ? 'disabled' : ''}>${STATUSES.map(s => `<option ${s === (kids ? effStatus(item) : status) ? 'selected' : ''}>${s}</option>`).join('')}</select>
          ${kids ? `<div class="help">Rolled up from sub-items (lowest status). Change a sub-item to update it.</div>` : ''}
        </div>
        <div class="field"><label>Deadline</label><input type="date" name="deadline" value="${esc(item?.deadline || '')}"><div class="help" data-due></div></div>
      </div>
      <div class="field"><label>Owner</label><input type="text" name="owner" value="${esc(item?.owner || '')}" placeholder="Optional"></div>
      <div class="field"><label>Notes</label><textarea name="notes" placeholder="Optional">${esc(item?.notes || '')}</textarea></div>
      ${others.length ? `<div class="field"><label>Also linked to initiative</label><div class="checks">${others.map(o => `<label><input type="checkbox" name="links" value="${o.id}" ${(item?.links || []).includes(o.id) ? 'checked' : ''}> ${esc(o.name)}</label>`).join('')}</div>
        <div class="help">Linked items, with their sub-items, also appear in that initiative’s checklist and board.</div>
        ${item ? others.map(o => { const src = ancestors(item).reverse().find(x => (x.links || []).includes(o.id)); return src ? `<div class="help">Also shown in ${esc(o.name)} because its parent ${esc(codeOf(src))} ${esc(src.name)} is linked. Unlink ${esc(codeOf(src))} to remove it there.</div>` : ''; }).join('') : ''}</div>` : ''}
    </div>
    <footer>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${item ? `<button class="btn sm danger" data-del>Delete</button><button class="btn sm" data-move="-1" title="Move up">↑</button><button class="btn sm" data-move="1" title="Move down">↓</button>` : ''}
      </div>
      <div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn primary" data-save>${item ? 'Save' : 'Add'}</button></div>
    </footer>`, bd => {
    const q = n => bd.querySelector(`[name="${n}"]`);
    const showDue = () => {
      const v = q('deadline').value, el = bd.querySelector('[data-due]');
      if (!v) { el.textContent = ''; return; }
      const n = daysUntil(v);
      el.textContent = n < 0 ? `Overdue by ${-n} day${n === -1 ? '' : 's'}` : n === 0 ? 'Due today' : `${n} day${n === 1 ? '' : 's'} from today`;
      el.style.color = n < 0 ? 'var(--danger)' : n <= 7 ? 'var(--warn)' : '';
    };
    q('deadline').addEventListener('input', showDue); showDue();
    bd.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
    bd.querySelector('[data-save]').onclick = () => {
      const name = q('name').value.trim();
      if (!name) { q('name').focus(); toast('Please enter a name.'); return; }
      const links = [...bd.querySelectorAll('[name=links]:checked')].map(x => x.value);
      const newParent = q('parentId').value || null;
      if (item) {
        if (item.parentId !== newParent) { item.parentId = newParent; item.order = nextOrder(initId, newParent); }
        Object.assign(item, { name, deadline: q('deadline').value, owner: q('owner').value.trim(), notes: q('notes').value.trim(), links });
        if (!kids) { const ns = q('status').value; if (ns === 'Completed' && item.status !== 'Completed') item.prevStatus = item.status; item.status = ns; }
        touch(item);
        commit({ items: [item] });
      } else {
        const now = new Date().toISOString();
        const created = { id: uid(), initiativeId: initId, parentId: newParent, name, status: q('status').value, deadline: q('deadline').value, owner: q('owner').value.trim(), notes: q('notes').value.trim(), links, order: nextOrder(initId, newParent), createdAt: now, updatedAt: now };
        db.items.push(created); commit({ items: [created] });
        if (newParent) ui.collapsed = ui.collapsed.filter(c => c !== newParent);
      }
      saveUI(); closeModal(); render();
    };
    bd.querySelector('[data-del]')?.addEventListener('click', () => {
      const n = descendants(item).length;
      confirmDialog(`Delete “${item.name}”${n ? ` and its ${n} sub-item${n > 1 ? 's' : ''}` : ''}? This cannot be undone.`, 'Delete', () => deleteItem(item.id), () => itemModal({ id: item.id }));
    });
    bd.querySelectorAll('[data-move]').forEach(b => b.onclick = () => { moveItem(item.id, Number(b.dataset.move)); itemModal({ id: item.id }); });
  });
}

function initModal(id) {
  const init = id ? IDX.initById.get(id) : null;
  const tracks = init ? tracksOf(init.id) : [];
  const linkedIn = init ? db.items.filter(i => i.initiativeId !== init.id && (i.links || []).includes(init.id)) : [];
  const delNote = !init ? '' : tracks.length
    ? `To delete this initiative, first delete its ${tracks.length} track${tracks.length === 1 ? '' : 's'}.`
    : 'This initiative has no tracks, so it can be deleted.';
  openModal(`
    <header><h3>${init ? 'Edit initiative' : 'New initiative'}</h3><button class="btn ghost sm" data-close>✕</button></header>
    <div class="body">
      <div class="field"><label for="initName">Name</label><input type="text" id="initName" name="name" value="${esc(init?.name || '')}" placeholder="e.g. POLARIS">
        ${init ? '<div class="help">Renaming keeps all tracks, items, links and progress.</div>' : ''}</div>
      <div class="field"><label for="initDesc">Description</label><input type="text" id="initDesc" name="description" value="${esc(init?.description || '')}" placeholder="Optional one-liner"></div>
      <div class="help" data-err style="color:var(--danger)" hidden></div>
      ${init ? `<div class="help" data-delnote>${delNote}</div>` : ''}
    </div>
    <footer>
      <div style="display:flex;gap:6px">${init ? `<button class="btn sm danger" data-del ${tracks.length ? 'disabled title="Delete its tracks first"' : ''}>Delete initiative</button><button class="btn sm" data-move="-1" title="Move left">←</button><button class="btn sm" data-move="1" title="Move right">→</button>` : ''}</div>
      <div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn primary" data-save>${init ? 'Save' : 'Create'}</button></div>
    </footer>`, bd => {
    const err = m => { const e = bd.querySelector('[data-err]'); e.textContent = m; e.hidden = !m; };
    bd.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
    bd.querySelector('[data-save]').onclick = () => {
      const name = bd.querySelector('[name=name]').value.trim();
      const description = bd.querySelector('[name=description]').value.trim();
      if (!name) { err('Enter a name for the initiative.'); bd.querySelector('[name=name]').focus(); return; }
      const clash = db.initiatives.find(i => i.id !== init?.id && i.name.trim().toLowerCase() === name.toLowerCase());
      if (clash) { err(`An initiative called “${clash.name}” already exists. Choose a different name.`); return; }
      if (init) { Object.assign(init, { name, description }); commit({ inits: [init] }); toast(`Saved ${name}.`); }
      else { const n = { id: uid(), name, description, order: db.initiatives.length ? Math.max(...db.initiatives.map(i => i.order ?? 0)) + 1 : 0, createdAt: new Date().toISOString() }; db.initiatives.push(n); commit({ inits: [n] }); ui.view = n.id; ui.track = 'all'; }
      saveUI(); closeModal(); render();
    };
    bd.querySelector('[data-del]')?.addEventListener('click', () => {
      // Re-check against the latest data: someone may have added a track meanwhile.
      index();
      const left = tracksOf(init.id).length;
      if (left) { err(`“${init.name}” still has ${left} track${left === 1 ? '' : 's'}. Delete ${left === 1 ? 'it' : 'them'} first.`); return; }
      const linkNote = linkedIn.length ? ` ${linkedIn.length} item${linkedIn.length === 1 ? '' : 's'} from other initiatives linked to it will be unlinked.` : '';
      confirmDialog(`Delete initiative “${init.name}”? It has no tracks.${linkNote}`, 'Delete initiative', () => {
        db.initiatives = db.initiatives.filter(i => i.id !== init.id);
        const relinked = db.items.filter(i => (i.links || []).includes(init.id));
        relinked.forEach(i => { i.links = i.links.filter(l => l !== init.id); touch(i); });
        commit({ items: relinked, delInits: [init.id] }).then(ok => { if (ok) toast(`Deleted ${init.name}.`); });
        ui.view = 'overview'; ui.track = 'all'; saveUI(); render();
      }, () => initModal(init.id));
    });
    bd.querySelectorAll('[data-move]').forEach(b => b.onclick = () => {
      const list = initiatives(); const i = list.indexOf(init), j = i + Number(b.dataset.move);
      if (j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]]; list.forEach((x, k) => x.order = k); commit({ inits: list }); render();
    });
  });
}

/* --------------------------------------------------------------- export */
function rowsForExport() {
  const rows = [];
  const walk = (item, depth) => {
    const d = dueInfo(item), dl = effDeadline(item), init = IDX.initById.get(item.initiativeId), track = trackOf(item);
    rows.push({
      'Initiative': init?.name || '',
      'Track': `${codeOf(track)}. ${track.name}`,
      'Code': codeOf(item),
      'Item': '    '.repeat(depth) + item.name,
